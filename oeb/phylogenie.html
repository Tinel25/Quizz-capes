    <script>
        const questions = [
            {
    question: "Qu'est-ce que le fixisme ?",

        "Une théorie où l'environnement transforme les organismes",
        "Une théorie où les espèces évoluent rapidement par mutations",

},
{
    question: "Qu'est-ce que l'évolutionnisme ?",

        "Une vision où les êtres vivants ne changent jamais au cours du temps",
        "Une vision où plus on observe les êtres vivants sur le temps, plus des changements apparaissent",
        "Une théorie uniquement basée sur les observations de fossiles anciens",

    explanation: "L'évolutionnisme est une vision selon laquelle plus on observe les êtres vivants sur le temps, plus des changements apparaissent."
},
{
    question: "Qu'est-ce que le gradualisme ?",
    options: [
        "Les changements évolutifs se font rapidement sur de courtes périodes",
        "Les espèces restent stables et ne changent jamais au cours du temps",
        "Les changements se font uniquement lors d'extinctions massives",
        "Les changements évolutifs se font progressivement sur de longues périodes"
    ],
    correct: 3,
    explanation: "Le gradualisme, vision des généticiens, postule que les changements évolutifs se font progressivement, sur de longues périodes."
},
{
    question: "Qu'est-ce que l'équilibre ponctué ?",
    options: [
        "Les changements se font uniquement à l'échelle moléculaire",
        "Les espèces évoluent de manière constante et régulière",
        "Les espèces restent stables puis subissent des changements rapides sur de courtes périodes",
        "Les organismes se transforment progressivement en formes complexes"
    ],
    correct: 2,
    explanation: "L'équilibre ponctué, vision des paléontologues, postule que les espèces restent stables pendant de longues périodes, puis subissent des changements rapides sur de courtes périodes."
},
{
    question: "Qui est J.B. de Lamarck et quelle est sa contribution ?",
    options: [
        "Le découvreur de la structure de l'ADN au XIXe siècle",
        "Le créateur de la théorie de la sélection naturelle",
        "Le fondateur de la classification moderne des espèces vivantes",
        "Le premier à proposer la théorie de l'évolution des espèces (le transformisme)"
    ],
    correct: 3,
    explanation: "J.B. de Lamarck (1744-1829) est le premier à avoir proposé la théorie de l'évolution des espèces appelée transformisme, selon laquelle l'environnement transforme les organismes en formes plus complexes."
},
{
    question: "Que représente chaque nœud dans un arbre phylogénétique ?",
    options: [
        "Un organisme actuel vivant observé directement",
        "Un ancêtre commun hypothétique entre plusieurs espèces",
        "Une extinction massive d'espèces au cours du temps",
        "Une mutation génétique spécifique identifiée par séquençage"
    ],
    correct: 1,
    explanation: "Chaque nœud dans un arbre phylogénétique représente un ancêtre commun hypothétique entre les espèces qui en descendent."
},
{
    question: "Pourquoi peut-on construire un arbre phylogénétique ?",
    options: [
        "Parce que tous les organismes ont exactement le même ADN",
        "Parce qu'il n'y a aucune mutation dans l'ADN au cours du temps",
        "Parce que l'ADN ne se transmet pas d'une génération à l'autre",
        "Parce qu'il y a transmission verticale d'ADN et variation (mutations)"
    ],
    correct: 3,
    explanation: "On peut construire un arbre phylogénétique car il y a transmission verticale d'ADN d'une génération à l'autre et de la variation due aux mutations."
},
{
    question: "Quelle est la différence principale entre généalogie et phylogénie ?",
    options: [
        "La généalogie étudie uniquement les plantes et la phylogénie les animaux",
        "En généalogie on étudie des individus actuels, en phylogénie les ancêtres sont hypothétiques",
        "En généalogie on utilise l'ADN, en phylogénie on utilise la morphologie",
        "La généalogie étudie les espèces éteintes, la phylogénie les espèces actuelles"
    ],
    correct: 1,
    explanation: "En généalogie, on se demande qui descend de qui avec des individus actuels. En phylogénie, les ancêtres sont hypothétiques (inconnus), on se demande qui est proche de qui."
},
{
    question: "Dans l'exemple grenouille-humain-truite, qui est phylogénétiquement plus proche de qui ?",
    options: [
        "L'humain est plus proche de la truite que de la grenouille",
        "La grenouille est équidistante de l'humain et de la truite",
        "Les trois espèces partagent exactement le même ancêtre commun récent",
        "L'humain est plus proche de la grenouille que de la truite"
    ],
    correct: 3,
    explanation: "L'humain est phylogénétiquement plus proche de la grenouille que de la truite, car ils partagent un ancêtre commun plus récent."
},
{
    question: "Que représentent les feuilles dans un arbre phylogénétique ?",
    options: [
        "Les ancêtres communs hypothétiques de toutes les espèces",
        "Les taxons (organismes) étudiés actuels ou fossiles",
        "Les mutations qui se sont accumulées au cours de l'évolution",
        "Les extinctions d'espèces survenues dans le passé"
    ],
    correct: 1,
    explanation: "Sur un arbre phylogénétique, les feuilles représentent des taxons (organismes) actuels ou fossiles étudiés."
},
{
    question: "Qu'est-ce que la racine d'un arbre phylogénétique ?",
    options: [
        "Le taxon le plus évolué et complexe de l'arbre étudié",
        "La dernière espèce apparue dans l'évolution du groupe",
        "Le point de divergence entre deux espèces actuelles uniquement",
        "L'ancêtre commun à tous les organismes étudiés qui oriente l'arbre dans le temps"
    ],
    correct: 3,
    explanation: "La racine représente l'ancêtre commun à tous les organismes étudiés, elle permet d'orienter l'arbre dans le temps et de connaître les relations phylogénétiques entre les espèces."
},
{
    question: "Qu'est-ce qu'un groupe monophylétique ?",
    options: [
        "Un groupe comprenant un ancêtre et tous ses descendants directs",
        "Un groupe basé sur des caractères similaires d'origines différentes",
        "Un groupe ne contenant qu'une seule espèce actuelle vivante",
        "Un groupe d'espèces qui ne partagent aucun ancêtre commun"
    ],
    correct: 0,
    explanation: "Un groupe monophylétique comprend un ancêtre commun et tous ses descendants, formant un clade naturel."
},
{
    question: "Qu'est-ce qu'un groupe paraphylétique ?",
    options: [
        "Un groupe comprenant tous les descendants d'un ancêtre commun",
        "Un groupe basé uniquement sur des caractères morphologiques",
        "Un groupe avec des caractères similaires d'origines différentes",
        "Un groupe avec un ancêtre commun mais excluant certains de ses descendants"
    ],
    correct: 3,
    explanation: "Un groupe paraphylétique comprend un ancêtre commun et certains de ses descendants, mais pas tous (ex: reptiles excluant les oiseaux)."
},
{
    question: "Qu'est-ce qu'un groupe polyphylétique ?",
    options: [
        "Un groupe comprenant un ancêtre et tous ses descendants",
        "Un groupe défini par des états de caractères similaires d'origines différentes",
        "Un groupe comprenant plusieurs espèces d'un même genre",
        "Un groupe comprenant uniquement des espèces fossiles éteintes"
    ],
    correct: 1,
    explanation: "Un groupe polyphylétique est défini par des états de caractères similaires provenant d'origines différentes, comme les oiseaux et les chauves-souris (convergence des ailes)."
},
{
    question: "Pourquoi s'intéresse-t-on principalement aux groupes monophylétiques en phylogénie ?",
    options: [
        "Parce que les groupes monophylétiques sont plus faciles à observer",
        "Parce que seuls les groupes monophylétiques contiennent de l'ADN",
        "Parce que les groupes monophylétiques évoluent plus rapidement",
        "Parce que les autres groupes (paraphylétiques et polyphylétiques) sont basés sur des artéfacts"
    ],
    correct: 3,
    explanation: "En phylogénie, on s'intéresse aux groupes monophylétiques car les deux autres types de groupes (paraphylétiques et polyphylétiques) sont basés sur des artéfacts évolutifs."
},
{
    question: "Qu'est-ce qu'un état de caractère homologue ?",
    options: [
        "Un caractère qui évolue de manière identique dans deux lignées",
        "Un caractère hérité d'un ancêtre commun (ascendance partagée)",
        "Un caractère similaire mais d'origines différentes entre espèces",
        "Un caractère qui a disparu puis est réapparu dans l'évolution"
    ],
    correct: 1,
    explanation: "Un état de caractère homologue est un caractère hérité d'un ancêtre commun, reflétant une ascendance partagée entre les organismes."
},
{
    question: "Qu'est-ce qu'un état de caractère homoplasique ?",
    options: [
        "Un caractère hérité directement d'un ancêtre commun récent",
        "Un caractère présent uniquement chez les espèces éteintes",
        "Un caractère qui ne subit jamais de mutations au cours du temps",
        "Un caractère similaire mais d'origines différentes entre espèces"
    ],
    correct: 3,
    explanation: "Un état de caractère homoplasique correspond à des caractères similaires mais d'origines différentes (convergence, réversion ou parallélisme)."
},
{
    question: "Qu'est-ce que la convergence évolutive ?",
    options: [
        "Deux lignées évoluent vers un même état de caractère indépendamment",
        "Un retour à un état ancestral après une modification évolutive",
        "La transmission horizontale de gènes entre deux espèces différentes",
        "L'évolution identique à partir du même état ancestral partagé"
    ],
    correct: 0,
    explanation: "La convergence évolutive se produit lorsque deux lignées évoluent indépendamment vers un même état de caractère (ex: ailes des insectes et des oiseaux)."
},
{
    question: "Qu'est-ce qu'une réversion en évolution ?",
    options: [
        "L'évolution vers un nouvel état de caractère unique",
        "La duplication d'un gène au sein d'une même espèce",
        "L'acquisition de gènes par transfert horizontal entre espèces",
        "Le retour à un état ancestral après une modification"
    ],
    correct: 3,
    explanation: "Une réversion est le retour à un état ancestral (ex: perte de la vision chez les taupes et certains poissons des grottes)."
},
{
    question: "Qu'est-ce que le parallélisme évolutif ?",
    options: [
        "Deux lignées évoluent vers des états complètement différents",
        "Deux lignées évoluent de manière similaire à partir du même état ancestral",
        "Une lignée évolue tandis que l'autre reste identique à l'ancêtre",
        "Deux lignées fusionnent pour former une nouvelle espèce hybride"
    ],
    correct: 1,
    explanation: "Le parallélisme se produit lorsque deux lignées évoluent de manière similaire à partir du même état ancestral (ex: résistance aux antibiotiques chez des bactéries non apparentées)."
},
{
    question: "Quelle est la première étape dans la reconstitution phylogénétique ?",
    options: [
        "L'interprétation des résultats obtenus et leur validation",
        "L'alignement des séquences d'ADN homologues à comparer",
        "Le nettoyage des séquences et l'élimination des artéfacts",
        "La sélection des données (taxons, gènes ou marqueurs)"
    ],
    correct: 3,
    explanation: "La première étape est la sélection des données, qui doit répondre à une question biologique claire: quels taxons, gènes ou marqueurs étudier."
},
{
    question: "D'où peuvent provenir les données de séquences pour une analyse phylogénétique ?",
    options: [
        "Uniquement de l'observation morphologique directe des organismes",
        "De bases de données publiques (GenBank, EMBL) ou de séquençage spécifique",
        "Uniquement de l'étude des fossiles anciens retrouvés",
        "Uniquement de séquençage réalisé en laboratoire personnel"
    ],
    correct: 1,
    explanation: "Les données peuvent provenir de bases de données publiques (GenBank, EMBL) ou de séquençage spécifiques si les données manquent."
},
{
    question: "Quel est le but de l'alignement de séquences en phylogénie ?",
    options: [
        "Créer des différences artificielles entre les séquences comparées",
        "Éliminer toutes les séquences qui ne sont pas identiques",

},
{
    question: "Que sont les gaps (tirets) dans un alignement de séquences ?",

        "Des erreurs de séquençage qu'il faut absolument éliminer",

{
    question: "Quels coûts/pénalités attribuent les programmes d'alignement ?",

{
    question: "Que peut-on conclure d'une mutation rare en 2ème position du codon chez le quagga ?",
    options: [
        "C'est certainement une mutation réelle apparue du vivant de l'animal",
        "C'est probablement un artéfact expérimental à vérifier",
        "C'est une mutation ancestrale partagée par tous les vertébrés",
        "C'est une mutation sans aucune importance phylogénétique"
    ],
    correct: 1,
    explanation: "Une mutation en 2ème position du codon est rare et entraîne toujours un changement d'acide aminé. Si elle n'est présente que chez le quagga (ADN ancien) alors que tous les autres vertébrés ont une cytosine, c'est probablement un artéfact expérimental."
}
        ];

        let currentQuestion = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let userAnswers = [];
        let shuffledQuestions = [];

        // Fonction pour mélanger un tableau (algorithme de Fisher-Yates)
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialiser le quiz avec les questions mélangées
        function initQuiz() {
            shuffledQuestions = shuffleArray(questions);
            currentQuestion = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            userAnswers = [];
            loadQuestion();
        }

        function loadQuestion() {
            const question = shuffledQuestions[currentQuestion];
            const quizContent = document.getElementById('quizContent');
            
            quizContent.innerHTML = `
                <div class="question-block active">
                    <div class="question-number">Question ${currentQuestion + 1} sur ${shuffledQuestions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="options" id="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})">
                                <input type="radio" name="answer" id="option${index}" value="${index}">
                                <label for="option${index}">${option}</label>
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="buttons">
                        <button class="btn-validate" id="validateBtn" onclick="validateAnswer()" disabled>
                            ✓ Valider la réponse
                        </button>
                        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">
                            Question suivante →
                        </button>
                    </div>
                </div>
            `;
            
            updateProgress();
        }

        function selectOption(index) {
            document.querySelectorAll('.option').forEach(opt => {
                opt.style.background = '#f8f9fa';
                opt.style.borderColor = '#e0e0e0';
            });
            
            const selectedOption = document.querySelectorAll('.option')[index];
            selectedOption.style.background = '#f0f4ff';
            selectedOption.style.borderColor = '#667eea';
            
            document.getElementById(`option${index}`).checked = true;
            document.getElementById('validateBtn').disabled = false;
        }

        function validateAnswer() {
            const selectedOption = document.querySelector('input[name="answer"]:checked');
            if (!selectedOption) return;
            
            const userAnswer = parseInt(selectedOption.value);
            const question = shuffledQuestions[currentQuestion];
            const isCorrect = userAnswer === question.correct;
            
            userAnswers.push({
                question: currentQuestion,
                answer: userAnswer,
                correct: isCorrect
            });
            
            if (isCorrect) {
                correctAnswers++;
            } else {
                incorrectAnswers++;
            }
            
            const options = document.querySelectorAll('.option');
            options.forEach((opt, index) => {
                opt.style.pointerEvents = 'none';
                if (index === question.correct) {
                    opt.classList.add('correct');
                } else if (index === userAnswer && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });
            
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'incorrect');
            feedback.innerHTML = `
                <strong>${isCorrect ? '✓ Bonne réponse !' : '✗ Mauvaise réponse'}</strong>
                ${question.explanation}
            `;
            
            document.getElementById('validateBtn').style.display = 'none';
            document.getElementById('nextBtn').classList.add('show');
        }

        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} sur ${shuffledQuestions.length}`;
        }

        function showResults() {
            document.querySelector('.progress-container').style.display = 'none';
            document.getElementById('quizContent').style.display = 'none';
            
            const percentage = Math.round((correctAnswers / shuffledQuestions.length) * 100);
            document.getElementById('scoreCircle').textContent = percentage + '%';
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('incorrectCount').textContent = incorrectAnswers;
            document.getElementById('results').classList.add('show');
        }

        function restartQuiz() {
            document.querySelector('.progress-container').style.display = 'block';
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            
            initQuiz();
        }

        // Démarrer le quiz avec les questions mélangées
        initQuiz();
    </script>
</body>
</html>
