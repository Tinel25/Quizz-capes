
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domestication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .btn-back {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) translateX(-3px);
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .progress-container {
            background: #f0f0f0;
            padding: 20px 30px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            margin-top: 10px;
            text-align: center;
            color: #666;
            font-weight: 600;
        }
        
        .quiz-content {
            padding: 30px;
        }
        
        .question-block {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .question-block.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(5px);
        }
        
        .option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .option label {
            cursor: pointer;
            flex: 1;
            font-size: 16px;
            color: #333;
        }
        
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.correct {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
        }
        
        .feedback.incorrect {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }
        
        .feedback strong {
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }
        
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }
        
        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-validate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }
        
        .btn-validate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-validate:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-next {
            background: #28a745;
            color: white;
            display: none;
        }
        
        .btn-next:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        
        .btn-next.show {
            display: block;
        }
        
        .results {
            display: none;
            text-align: center;
            padding: 40px 30px;
        }
        
        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        .results h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
        }
        
        .score-circle {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .results-details {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        
        .result-item {
            text-align: center;
        }
        
        .result-item .number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .result-item .label {
            color: #666;
            font-size: 14px;
        }
        
        .result-item.correct .number {
            color: #28a745;
        }
        
        .result-item.incorrect .number {
            color: #dc3545;
        }
        
        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 30px;
            padding: 16px 40px;
        }
        
        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .btn-back {
                position: static;
                transform: none;
                display: inline-block;
                margin-bottom: 15px;
            }
            
            .btn-back:hover {
                transform: translateX(-3px);
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .question-text {
                font-size: 18px;
            }
            
            .option label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="btn-back">← Retour à l'accueil</a>
            <h1>OEB</h1>
            <p>Domestication</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Question 1 sur 80</div>
        </div>
        
        <div class="quiz-content" id="quizContent"></div>
        
        <div class="results" id="results">
            <h2>🎉 Quiz Terminé !</h2>
            <div class="score-circle" id="scoreCircle"></div>
            <div class="results-details">
                <div class="result-item correct">
                    <div class="number" id="correctCount">0</div>
                    <div class="label">Bonnes réponses</div>
                </div>
                <div class="result-item incorrect">
                    <div class="number" id="incorrectCount">0</div>
                    <div class="label">Mauvaises réponses</div>
                </div>
            </div>
            <button class="btn-restart" onclick="restartQuiz()">🔄 Recommencer le quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            {
    question: "Qu'est-ce que la domestication ?",
    options: [
        "Le processus de capture d'animaux sauvages",
        "L'ensemble des processus évolutifs d'une population pour s'adapter aux contraintes dirigées par l'Homme",
        "La modification génétique des espèces en laboratoire",
        "L'introduction d'espèces dans de nouveaux territoires"
    ],
    correct: 1,
    explanation: "La domestication est l'ensemble des processus évolutifs d'une population pour s'adapter aux contraintes dirigées par l'Homme (sélection artificielle) selon ses aptitudes biologiques."
},
{
    question: "À quelle époque trouve-t-on les premières preuves de domestication (à l'exception du chien) ?",
    options: [
        "Au Paléolithique, il y a 50 000 ans",
        "Au début du Néolithique, il y a 11 000 ans",
        "À l'époque romaine, il y a 2 000 ans",
        "Au Moyen Âge, il y a 1 000 ans"
    ],
    correct: 1,
    explanation: "Les premières preuves de domestication datent du début du Néolithique (11 000 ans), dans le 'croissant fertile' (Mésopotamie), lorsque les humains ont commencé à se sédentariser."
},
{
    question: "Quel animal a été le premier à être domestiqué par l'Homme ?",
    options: [
        "Le mouton",
        "La vache",
        "Le chien",
        "Le cheval"
    ],
    correct: 2,
    explanation: "Le chien (Canis familiaris) a été domestiqué il y a environ 15 000 ans, bien avant n'importe quel autre animal, à partir du loup gris."
},
{
    question: "Quels sont les deux prérequis essentiels pour la domestication des animaux ?",
    options: [
        "Être carnivore et avoir une grande taille",
        "Vivre en densités élevées et se reproduire en présence de l'Homme",
        "Être herbivore et avoir un pelage épais",
        "Vivre en solitaire et être agressif"
    ],
    correct: 1,
    explanation: "Les prérequis pour la domestication sont : vivre à des densités de population importantes (en groupe) et se reproduire en présence de l'Homme (en captivité)."
},
{
    question: "Pourquoi le loup et l'Homme ont-ils pu former un partenariat naturel ?",
    options: [
        "Car ils avaient peur des mêmes prédateurs",
        "Car ils occupaient la même guilde et avaient des organisations sociales similaires",
        "Car le loup était naturellement docile",
        "Car l'Homme pouvait nourrir facilement le loup"
    ],
    correct: 1,
    explanation: "Homme et loup occupaient la même guilde (groupe fonctionnel) avec des sociabilités complexes et des organisations proches, ce qui a permis un mutualisme dans la chasse."
},
{
    question: "Quel impact majeur la domestication du chien a-t-elle eu sur l'histoire humaine ?",
    options: [
        "Uniquement la compagnie et le divertissement",
        "Meilleurs succès de chasse, augmentation de protéines et conséquences sur l'hominisation",
        "Seulement la protection des campements",
        "Aucun impact significatif"
    ],
    {
    question: "Quels bénéfices les biotechnologies modernes peuvent-elles apporter à l'agriculture ?",
    options: [
        "Uniquement augmenter la taille des fruits",
        "Diminution des ressources énergétiques, résistance aux parasites, tolérance aux stress, optimisation des minéraux",
        "Seulement améliorer le goût",
        "Uniquement réduire les coûts"
    ],
    correct: 1,
    explanation: "Les biotechnologies modernes apportent de nombreux bénéfices : diminution de l'utilisation des ressources énergétiques, optimisation de l'assimilation des éléments minéraux, résistance aux parasites et ravageurs, tolérance aux herbicides et aux stress environnementaux, et stérilité génétique."
},
{
    question: "Qu'est-ce qu'une 'lignée domestiquée' ?",
    options: [
        "Un groupe d'animaux sauvages",
        "Un groupe d'individus ayant acquis des performances, apparence et histoire sélective uniformes selon les sélections de l'Homme",
        "Une espèce récemment découverte",
        "Un hybride naturel"
    ],
    correct: 1,
    explanation: "Une lignée domestiquée est un groupe d'individus d'une espèce (animale ou végétale) qui a acquis au fil des générations des performances, une apparence et une histoire sélective uniformes selon les sélections effectuées par l'Homme."
},
{
    question: "Quelle est la différence entre zone de domestication et zone de diversification ?",
    options: [
        "Il n'y a pas de différence",
        "Zone de domestication : mise sous dépendance de l'Homme ; Zone de diversification : sélection de plusieurs formes/lignées",
        "Les deux termes sont synonymes",
        "Zone de domestication est toujours plus grande"
    ],
    correct: 1,
    explanation: "La zone de domestication est l'aire où s'est effectuée la mise 'sous dépendance totale' de l'Homme. La zone de diversification est celle où plusieurs formes ont été sélectionnées à partir du premier type domestiqué pour donner plusieurs lignées domestiquées."
},
{
    question: "Qu'est-ce qu'une zone d'acclimatation ?",
    options: [
        "La zone d'origine d'une espèce",
        "Installation d'un organisme dans une région différente de son aire d'origine, capable d'y survivre",
        "Une zone sans climat",
        "Une zone protégée"
    ],
    correct: 1,
    explanation: "Une zone d'acclimatation est une région où un organisme a été installé hors de son aire d'origine et où il est capable de survivre et de se maintenir dans ces nouvelles conditions environnementales."
},
{
    question: "Pourquoi les premiers humains ont-ils commencé à pratiquer l'élevage ?",
    options: [
        "Pour le sport et les loisirs",
        "Assurer un approvisionnement régulier en viande fraîche (garde-manger disponible)",
        "Pour décorer leurs campements",
        "Par hasard sans raison précise"
    ],
    correct: 1,
    explanation: "L'élevage permettait d'assurer un approvisionnement régulier en viande fraîche, créant un 'garde-manger disponible', contrairement à la chasse qui dépendait du hasard des rencontres et où le surplus de viande se dégradait avec le temps."
},
{
    question: "Quand et où les bovins ont-ils été domestiqués en Inde ?",
    options: [
        "Il y a 5 000 ans dans l'Himalaya",
        "Il y a 10 000 ans dans la vallée de l'Indus",
        "Il y a 20 000 ans au sud de l'Inde",
        "Il y a 2 000 ans au Pakistan"
    ],
    correct: 1,
    explanation: "En Inde, les bovins ont été domestiqués il y a 10 000 ans dans la vallée de l'Indus. La domestication s'est produite indépendamment à plusieurs endroits de manière quasi synchrone."
},
{
    question: "Quand la sous-espèce européenne d'aurochs (Bos primigenius primigenius) a-t-elle disparu ?",
    options: [
        "Au Moyen Âge",
        "Au 17ème siècle (1627 en Pologne)",
        "Au 19ème siècle",
        "Elle existe encore aujourd'hui"
    ],
    correct: 1,
    explanation: "L'aurochs européen (Bos primigenius primigenius), représenté sur les peintures pariétales de Lascaux et Chauvet, a disparu au 17ème siècle, le dernier spécimen étant mort en 1627 en Pologne."
},
{
    question: "Quelle découverte majeure Edward Jenner a-t-il faite vers 1790 grâce à l'élevage bovin ?",
    options: [
        "L'antibiotique",
        "La vaccination (les personnes travaillant avec les vaches n'attrapaient pas la variole)",
        "L'insuline",
        "Les vitamines"
    ],
    correct: 1,
    explanation: "Edward Jenner a découvert la vaccination vers 1790 en observant que les personnes travaillant avec les vaches n'attrapaient jamais la variole car elles étaient porteuses de la vaccine, une maladie similaire mais inoffensive pour les humains."
},
{
    question: "Quelle espèce de chat sauvage est à l'origine du chat domestique actuel ?",
    options: [
        "Le chat sauvage européen",
        "Felis silvestris lybica (Asie du Sud-Ouest et Afrique du Nord)",
        "Le lynx",
        "Le tigre"
    ],
    correct: 1,
    explanation: "Le chat domestique actuel descend principalement de Felis silvestris lybica d'Asie du Sud-Ouest et d'Afrique du Nord (Égypte). Prionailurus bengalensis a été utilisé en Chine mais n'a pas contribué aux races actuelles (sauf le chat du Bengale)."
},
{
    question: "Quelle différence comportementale majeure distingue le chat sauvage du chat domestique ?",
    options: [
        "Le chat domestique est carnivore, le sauvage herbivore",
        "Les chats sauvages sont grandement solitaires, les domestiques tolèrent humains et autres chats",
        "Le chat domestique ne chasse pas",
        "Il n'y a aucune différence"
    ],
    correct: 1,
    explanation: "Les différences comportementales les plus marquées concernent la sociabilité : les chats sauvages sont grandement solitaires tandis que les chats domestiques 'tolèrent' les humains et les autres chats à proximité."
},
{
    question: "Quel est l'état actuel des populations de chevaux sauvages ?",
    options: [
        "Très nombreuses dans le monde entier",
        "Plus aucune population réellement sauvage n'existe (sauf cheval de Przewalski)",
        "Seulement en Amérique",
        "En augmentation constante"
    ],
    correct: 1,
    explanation: "Plus aucune population de cheval réellement 'sauvage' n'existe actuellement. Le cheval de Przewalski (Mongolie) représente l'héritage 'vivant' de la forme sauvage originelle d'il y a 5000 ans, avant l'élevage."
},
{
    question: "Quelles sont les principales différences entre compartiments cultivé et sauvage d'une espèce végétale ?",
    options: [
        "Aucune différence",
        "Cultivé : faible variabilité, sélection artificielle ; Sauvage : grande variabilité, sélection naturelle",
        "Cultivé : grande variabilité ; Sauvage : faible variabilité",
        "Les deux ont la même variabilité"
    ],
    correct: 1,
    explanation: "Le compartiment cultivé présente une faible variabilité génétique (sélection artificielle, cultivars élites), tandis que le compartiment sauvage montre une grande variabilité phénotypique (sélection naturelle, adaptations locales, résistance aux maladies)."
},
{
    question: "Pourquoi est-il important de conserver la diversité génétique du compartiment sauvage ?",
    options: [
        "Pour des raisons esthétiques uniquement",
        "Pour l'amélioration des espèces cultivées et l'adaptation aux changements environnementaux",
        "Ce n'est pas important",
        "Uniquement pour les musées"
    ],
    correct: 1,
    explanation: "Il est crucial de conserver la diversité génétique (au moins dans le compartiment sauvage) pour l'amélioration des espèces cultivées et pour permettre une adaptation rapide aux changements environnementaux actuels. Pas d'évolution possible sans variabilité."
},
{
    question: "Qu'est-ce que la 'taille efficace de population' (Ne) ?",
    options: [
        "Le nombre total d'individus dans une population",
        "Le nombre de reproducteurs qui ont produit la génération suivante",
        "La taille physique moyenne des individus",
        "Le nombre de prédateurs"
    ],
    correct: 1,
    explanation: "La taille efficace de population (Ne) est le nombre de reproducteurs au sein d'une population qui ont produit la génération suivante. L'utilisation intensive de cultivars 'élites' diminue cette taille efficace, créant des populations génétiquement uniformes."
},
{
    question: "Qu'est-ce que le bouturage et quel est son avantage ?",
    options: [
        "Une technique de greffe complexe",
        "Reproduction par partition de parties supérieures, permet maturité sexuelle rapide",
        "Un type de fertilisation",
        "Une méthode d'irrigation"
    ],
    correct: 1,
    explanation: "Le bouturage ('cutting') est une technique où des parties supérieures de la plante sont prélevées et développent des racines. Les plantes bouturées atteignent leur maturité sexuelle (floraison) rapidement, ce qui est très utile en horticulture."
},
{
    question: "Qu'est-ce que le marcottage ?",
    options: [
        "Production de racines à partir d'une tige touchant le sol",
        "Division des racines uniquement",
        "Un type de semis",
        "Une maladie des plantes"
    ],
    correct: 0,
    explanation: "Le marcottage ('layering') est la production de méristèmes racinaires à partir de tissus apicaux lorsqu'une tige tombe et touche le sol. Au contact du sol (humidité, micro-plaies), il y a dédifférenciation puis redifférenciation en tissu racinaire."
},
{
    question: "Qu'est-ce que le drageonnage ?",
    options: [
        "Production de tiges à partir de racines",
        "Production de fleurs multiples",
        "Un type de taille des arbres",
        "Une maladie fongique"
    ],
    correct: 0,
    explanation: "Le drageonnage ('suckering') est la production de méristèmes apicaux (tiges) à partir de tissus racinaires, permettant la création de nouveaux individus physiques (ramets) à partir des racines."
},
{
    question: "Qu'est-ce que la greffe et quel est son principal avantage ?",
    options: [
        "Un mode de reproduction naturel",
        "Association de la vigueur/résistance du porte-greffe et de la productivité du greffon",
        "Une maladie des arbres",
        "Un type de fertilisation"
    ],
    correct: 1,
    explanation: "La greffe ('transplant') est plus un mode de propagation qu'un mode de reproduction. Très utilisée chez les arbres fruitiers, elle combine la vigueur/résistance du pied-receveur (porte-greffe) avec la productivité du transplant (greffon)."
},
{
    question: "Comment la téosinte en France s'est-elle adaptée au climat tempéré ?",
    options: [
        "Par mutation spontanée uniquement",
        "Par échanges génétiques avec le maïs tempéré européen (gènes ZCN8 et ACC1)",
        "Elle ne s'est pas adaptée",
        "Par sélection naturelle simple"
    ],
    correct: 1,
    explanation: "La téosinte s'est adaptée au climat tempéré français par échanges génétiques avec le maïs tempéré européen, acquérant notamment le gène ZCN8 (précocité de floraison) et la forme mutante du gène ACC1 (résistance aux herbicides)."
},
{
    question: "Quelles sont les 3 catégories principales de techniques de sélection végétale ?",
    options: [
        "Arrosage, fertilisation, taille",
        "Cultures sélectives, mutagenèse, ingénierie génétique",

        let currentQuestion = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let userAnswers = [];
        let shuffledQuestions = [];

        // Fonction pour mélanger un tableau (algorithme de Fisher-Yates)
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialiser le quiz avec les questions mélangées
        function initQuiz() {
            shuffledQuestions = shuffleArray(questions);
            currentQuestion = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            userAnswers = [];
            loadQuestion();
        }

        function loadQuestion() {
            const question = shuffledQuestions[currentQuestion];
            const quizContent = document.getElementById('quizContent');
            
            quizContent.innerHTML = `
                <div class="question-block active">
                    <div class="question-number">Question ${currentQuestion + 1} sur ${shuffledQuestions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="options" id="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})">
                                <input type="radio" name="answer" id="option${index}" value="${index}">
                                <label for="option${index}">${option}</label>
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="buttons">
                        <button class="btn-validate" id="validateBtn" onclick="validateAnswer()" disabled>
                            ✓ Valider la réponse
                        </button>
                        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">
                            Question suivante →
                        </button>
                    </div>
                </div>
            `;
            
            updateProgress();
        }

        function selectOption(index) {
            document.querySelectorAll('.option').forEach(opt => {
                opt.style.background = '#f8f9fa';
                opt.style.borderColor = '#e0e0e0';
            });
            
            const selectedOption = document.querySelectorAll('.option')[index];
            selectedOption.style.background = '#f0f4ff';
            selectedOption.style.borderColor = '#667eea';
            
            document.getElementById(`option${index}`).checked = true;
            document.getElementById('validateBtn').disabled = false;
        }

        function validateAnswer() {
            const selectedOption = document.querySelector('input[name="answer"]:checked');
            if (!selectedOption) return;
            
            const userAnswer = parseInt(selectedOption.value);
            const question = shuffledQuestions[currentQuestion];
            const isCorrect = userAnswer === question.correct;
            
            userAnswers.push({
                question: currentQuestion,
                answer: userAnswer,
                correct: isCorrect
            });
            
            if (isCorrect) {
                correctAnswers++;
            } else {
                incorrectAnswers++;
            }
            
            const options = document.querySelectorAll('.option');
            options.forEach((opt, index) => {
                opt.style.pointerEvents = 'none';
                if (index === question.correct) {
                    opt.classList.add('correct');
                } else if (index === userAnswer && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });
            
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'incorrect');
            feedback.innerHTML = `
                <strong>${isCorrect ? '✓ Bonne réponse !' : '✗ Mauvaise réponse'}</strong>
                ${question.explanation}
            `;
            
            document.getElementById('validateBtn').style.display = 'none';
            document.getElementById('nextBtn').classList.add('show');
        }

        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} sur ${shuffledQuestions.length}`;
        }

        function showResults() {
            document.querySelector('.progress-container').style.display = 'none';
            document.getElementById('quizContent').style.display = 'none';
            
            const percentage = Math.round((correctAnswers / shuffledQuestions.length) * 100);
            document.getElementById('scoreCircle').textContent = percentage + '%';
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('incorrectCount').textContent = incorrectAnswers;
            document.getElementById('results').classList.add('show');
        }

        function restartQuiz() {
            document.querySelector('.progress-container').style.display = 'block';
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            
            initQuiz();
        }

        // Démarrer le quiz avec les questions mélangées
        initQuiz();
    </script>
