<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sismologie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .btn-back {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) translateX(-3px);
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .progress-container {
            background: #f0f0f0;
            padding: 20px 30px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            margin-top: 10px;
            text-align: center;
            color: #666;
            font-weight: 600;
        }
        
        .quiz-content {
            padding: 30px;
        }
        
        .question-block {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .question-block.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(5px);
        }
        
        .option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .option label {
            cursor: pointer;
            flex: 1;
            font-size: 16px;
            color: #333;
        }
        
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.correct {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
        }
        
        .feedback.incorrect {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }
        
        .feedback strong {
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }
        
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }
        
        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-validate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }
        
        .btn-validate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-validate:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-next {
            background: #28a745;
            color: white;
            display: none;
        }
        
        .btn-next:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        
        .btn-next.show {
            display: block;
        }
        
        .results {
            display: none;
            text-align: center;
            padding: 40px 30px;
        }
        
        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        .results h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
        }
        
        .score-circle {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .results-details {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        
        .result-item {
            text-align: center;
        }
        
        .result-item .number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .result-item .label {
            color: #666;
            font-size: 14px;
        }
        
        .result-item.correct .number {
            color: #28a745;
        }
        
        .result-item.incorrect .number {
            color: #dc3545;
        }
        
        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 30px;
            padding: 16px 40px;
        }
        
        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .btn-back {
                position: static;
                transform: none;
                display: inline-block;
                margin-bottom: 15px;
            }
            
            .btn-back:hover {
                transform: translateX(-3px);
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .question-text {
                font-size: 18px;
            }
            
            .option label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="btn-back">← Retour à l'accueil</a>
            <h1>🌍 Quiz Dynamique Terre Solide</h1>
            <p>Sismologie</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Question 1 sur 80</div>
        </div>
        
        <div class="quiz-content" id="quizContent"></div>
        
        <div class="results" id="results">
            <h2>🎉 Quiz Terminé !</h2>
            <div class="score-circle" id="scoreCircle"></div>
            <div class="results-details">
                <div class="result-item correct">
                    <div class="number" id="correctCount">0</div>
                    <div class="label">Bonnes réponses</div>
                </div>
                <div class="result-item incorrect">
                    <div class="number" id="incorrectCount">0</div>
                    <div class="label">Mauvaises réponses</div>
                </div>
            </div>
            <button class="btn-restart" onclick="restartQuiz()">🔄 Recommencer le quiz</button>
        </div>
    </div>

    <script>
        const questions = [
           {
    question: "Qu'est-ce qu'un séisme tectonique ?",
    options: [
        "Un séisme causé par l'écroulement d'une caverne souterraine",
        "Un séisme causé par des explosions produites par l'Homme",
        "Un séisme causé par le mouvement d'une faille géologique",
        "Un séisme causé par la montée de lave dans un volcan"
    ],
    correct: 2,
    explanation: "Un séisme tectonique est un séisme causé par le mouvement d'une faille dans la croûte terrestre."
},
{
    question: "Où se produisent 80% des séismes naturels dans le monde ?",
    options: [
        "Dans les régions péri-Pacifique, surtout au niveau des zones de subduction",
        "Dans les zones intraplaques et sur les dorsales océaniques principalement",
        "En Méditerranée et en Asie centrale exclusivement dans l'Himalaya",
        "Sur les continents uniquement, jamais dans les océans profonds"
    ],
    correct: 0,
    explanation: "80% des séismes naturels se produisent dans les régions péri-Pacifique, principalement au niveau des zones de subduction."
},
{
    question: "Quelle est la durée typique d'un séisme ?",
    options: [
        "De 10 minutes à 2 heures pour les séismes moyens",
        "De 0,1 seconde à 1 minute selon l'intensité du séisme",
        "De 1 heure à plusieurs jours pour les plus grands",
        "De 5 minutes à 1 heure environ pour la plupart"
    ],
    correct: 1,
    explanation: "La durée d'un séisme varie généralement de 0,1 seconde à 1 minute."
},
{
    question: "Quelle est la différence entre l'hypocentre et l'épicentre ?",
    options: [
        "Ce sont deux termes synonymes désignant exactement le même point",
        "L'hypocentre est plus profond que l'épicentre de 100 kilomètres",
        "L'hypocentre est la projection en surface, l'épicentre en profondeur",
        "L'hypocentre est le foyer en profondeur, l'épicentre en surface"
    ],
    correct: 3,
    explanation: "L'hypocentre est le foyer sismique en profondeur, tandis que l'épicentre est la projection verticale du foyer à la surface."
},
{
    question: "Quelles sont les ondes sismiques les plus rapides ?",
    options: [
        "Les ondes P (primaires) qui arrivent en premier",
        "Les ondes de Rayleigh (ondes R) en surface",
        "Les ondes S (secondaires) qui sont moyennes",
        "Les ondes de Love (ondes L) sur les bords"
    ],
    correct: 0,
    explanation: "Les ondes P (primaires) sont les ondes les plus rapides. Elles se propagent par compression-dilatation et arrivent en premier sur les sismographes."
},
{
    question: "Quelle caractéristique distingue les ondes S des autres ondes ?",
    options: [
        "Elles sont les ondes les plus rapides de toutes",
        "Elles se propagent uniquement dans les liquides",
        "Elles se propagent uniquement en surface terrestre",
        "Elles ne traversent pas les liquides, déplacement vertical"
    ],
    correct: 3,
    explanation: "Les ondes S sont des ondes de volume secondaires qui se propagent par ondulation avec un déplacement vertical. Elles sont plus lentes que les ondes P et ne traversent pas les liquides."
},
{
    question: "Que sont les ondes de Love (ondes L) ?",
    options: [
        "Des ondes qui ne se propagent que dans l'eau océanique",
        "Des ondes de surface oscillant perpendiculairement à la propagation",
        "Des ondes de volume qui traversent le noyau terrestre complet",
        "Des ondes artificielles créées par l'homme pour les mesures"
    ],
    correct: 1,
    explanation: "Les ondes de Love sont des ondes de surface qui se propagent par oscillation dans un plan perpendiculaire à la direction de propagation. Elles sont plus lentes que les ondes S mais plus rapides que les ondes R."
},
{
    question: "Comment se propagent les ondes de Rayleigh (ondes R) ?",
    options: [
        "Par compression-dilatation horizontale sans mouvement vertical aucun",
        "Par propagation en ligne droite absolue sans aucune oscillation",
        "Par oscillation verticale sans mouvement elliptique des particules",
        "Par oscillation verticale avec mouvement elliptique des particules"
    ],
    correct: 3,
    explanation: "Les ondes de Rayleigh se propagent par oscillation dans un plan vertical à la direction de propagation avec un mouvement elliptique des particules. Elles arrivent généralement en dernier et sont plus lentes que les ondes S et L."
},
{
    question: "Quelle est la formule simplifiée pour calculer la distance épicentrale d ?",
    options: [
        "d = 4 × (ts + tp) pour tous les séismes",
        "d = 8 × (ts - tp) selon l'approximation standard",
        "d = 6 × (ts + tp) pour les séismes profonds",
        "d = 12 × (ts - tp) pour les séismes superficiels"
    ],
    correct: 1,
    explanation: "La distance épicentrale est calculée par d = 8 × (ts - tp), où ts est le temps d'arrivée de l'onde S et tp le temps d'arrivée de l'onde P. Cette formule vient de l'approximation (1/Vs - 1/Vp) = 1/8."
},
{
    question: "Combien de stations sismiques minimum sont nécessaires pour localiser un séisme par la méthode des cercles ?",
    options: [
        "Une seule station suffit toujours pour la localisation",
        "Au moins 2 stations différentes situées à proximité",
        "Au moins 5 stations différentes bien réparties géographiquement",
        "Au moins 3 stations différentes en des lieux distincts"
    ],
    correct: 3,
    explanation: "La méthode des cercles nécessite l'utilisation d'au moins 3 stations d'enregistrement situées en des lieux différents pour localiser précisément l'épicentre d'un séisme."
},
{
    question: "À quelle profondeur se situent les foyers des séismes superficiels ?",
    options: [
        "À moins de 70 km de profondeur dans la croûte",
        "À plus de 700 km de profondeur dans le manteau",
        "Entre 70 et 300 km de profondeur généralement",
        "Entre 300 et 700 km de profondeur exclusivement"
    ],
    correct: 0,
    explanation: "Les séismes superficiels ont leur foyer à moins de 70 km de profondeur. Ce sont les plus fréquents et généralement les plus destructeurs."
},
{
    question: "À quelle profondeur se situent les foyers des séismes intermédiaires ?",
    options: [
        "À plus de 700 km de profondeur dans le noyau",
        "À moins de 70 km de profondeur en surface",
        "Entre 300 et 700 km de profondeur uniquement",
        "Entre 70 et 300 km de profondeur principalement"
    ],
    correct: 3,
    explanation: "Les séismes intermédiaires ont leur foyer situé entre 70 et 300 km de profondeur. Ils se produisent principalement dans les zones de subduction."
},
{
    question: "Pourquoi n'y a-t-il pas de séismes à plus de 700 km de profondeur ?",
    options: [
        "Parce que le matériau devient trop ductile pour se fracturer",
        "Parce qu'il n'y a plus de failles à cette profondeur",
        "Parce que les ondes ne peuvent pas se propager aussi loin",
        "Parce que la température est trop basse à ces profondeurs"
    ],
    correct: 0,
    explanation: "Il n'y a pas de séismes à plus de 700 km de profondeur car, à ces profondeurs extrêmes, le matériau devient trop ductile (plastique) pour se fracturer de manière cassante et générer des séismes."
},
{
    question: "Dans quelle partie de la croûte continentale se produisent principalement les séismes ?",
    options: [
        "Entre 50 et 100 km de profondeur dans le manteau supérieur",
        "Dans les 15 premiers kilomètres, la partie cassante sismogène",
        "Uniformément dans toute l'épaisseur de la croûte terrestre",
        "Uniquement à la surface, dans le premier kilomètre seulement"
    ],
    correct: 1,
    explanation: "Dans la croûte continentale, les séismes se produisent principalement dans les 15 premiers kilomètres, dans la partie superficielle cassante appelée zone sismogène. La partie inférieure est plus ductile et génère moins de séismes."
},
{
    question: "Qu'est-ce que le plan de Wadati-Benioff ?",
    options: [
        "Un plan vertical séparant deux plaques divergentes sur les dorsales",
        "Un plan horizontal où se produisent tous les séismes superficiels",
        "Un plan imaginaire utilisé uniquement pour les projections stéréographiques",
        "Un plan incliné marquant le panneau plongeant dans les subductions"
    ],
    correct: 3,
    explanation: "Le plan de Wadati-Benioff est un plan incliné défini par les foyers des séismes qui marquent la position du panneau plongeant (lithosphère subductée) dans les zones de subduction."
},
{
    question: "Où se produisent les séismes intermédiaires et profonds ?",
    options: [
        "Dans les zones de subduction principalement avec le panneau plongeant",
        "Le long des failles transformantes uniquement sans autres contextes",
        "Dans les zones de rift continental uniquement lors de l'extension",
        "Sur les dorsales océaniques uniquement lors de l'accrétion océanique"
    ],
    correct: 0,
    explanation: "Les séismes intermédiaires (70-300 km) et profonds (300-700 km) se produisent principalement dans les zones de subduction, le long du panneau plongeant qui se déforme."
},
{
    question: "Qu'est-ce que l'intensité d'un séisme ?",
    options: [
        "La vitesse de propagation des ondes sismiques dans le sol",
        "La profondeur du foyer sismique mesurée en kilomètres",
        "La quantité d'énergie totale libérée par le séisme entier",
        "La force ressentie par un observateur et les destructions"
    ],
    correct: 3,
    explanation: "L'intensité d'un séisme est une évaluation qualitative de la force ressentie par les observateurs et des types de destructions. Elle dépend de la distance au foyer, du contexte géologique et du type de constructions."
},
{
    question: "De quoi dépend l'intensité d'un séisme ?",
    options: [
        "De la distance au foyer, contexte géologique, constructions, observateurs",
        "Uniquement du type d'ondes sismiques générées lors de la rupture",
        "Uniquement de la profondeur du foyer sismique dans la croûte",
        "Uniquement de la magnitude du séisme sans autres facteurs"
    ],
    correct: 0,
    explanation: "L'intensité dépend de plusieurs facteurs : la distance par rapport au foyer, la force du séisme, le contexte géologique local, le type de constructions et la perception des observateurs. Elle varie donc d'un lieu à l'autre."
},
{
    question: "Quelle échelle d'intensité est utilisée en Europe depuis 1997 ?",
    options: [
        "L'échelle de magnitude de moment Mw uniquement pour tout",
        "L'échelle EMS 92 (European Macroseismic Scale 1992) puis EMS 98",
        "L'échelle Modified Mercalli uniquement pour toute l'Europe entière",
        "L'échelle de Richter uniquement pour tous les pays européens"
    ],
    correct: 1,
    explanation: "En Europe, l'échelle EMS 92 (European Macroseismic Scale 1992), puis EMS 98, est utilisée depuis 1997 pour mesurer l'intensité des séismes, remplaçant l'échelle MSK."
},
{
    question: "Qu'est-ce que la magnitude d'un séisme ?",
    options: [
        "Le nombre de répliques enregistrées après le choc principal",
        "Une mesure quantitative de l'énergie libérée par le séisme",
        "La force ressentie par les observateurs présents sur place",
        "La durée totale du séisme mesurée en secondes ou minutes"
    ],
    correct: 1,
    explanation: "La magnitude est une mesure quantitative de la quantité d'énergie libérée par un séisme. Elle dépend de l'importance de la rupture sur la faille et est déterminée à partir des enregistrements sismiques."
},
{
    question: "Qu'est-ce que la magnitude locale de Richter (ML) ?",
    options: [
        "Une mesure basée sur le moment sismique total du séisme",
        "Une mesure basée uniquement sur les ondes de surface L",
        "Une mesure de l'amplitude enregistrée, corrigée selon la distance",
        "Une mesure basée uniquement sur les ondes P profondes MB"
    ],
    correct: 2,
    explanation: "La magnitude locale de Richter (ML) est établie d'après la plus forte amplitude enregistrée pour un événement sismique, corrigée selon la distance par rapport au foyer. Elle utilise des sismographes de type Wood-Anderson."
},
{
    question: "Quelle est la formule du moment sismique M0 ?",
    options: [
        "M0 = (μ × A) / D pour calculer le moment",
        "M0 = μ / (A × D) selon la formule standard",
        "M0 = μ + A + D pour obtenir le moment total",
        "M0 = μ × A × D selon Kanamori et les autres"
    ],
    correct: 3,
    explanation: "Le moment sismique est calculé par M0 = μ × A × D, où μ est la rigidité de la région focale, A est la surface de rupture sur la faille, et D est le déplacement total sur le plan de faille."
},
{
    question: "Quelle échelle de magnitude est basée sur le moment sismique ?",
    options: [
        "La magnitude de moment sismique (Mw) développée par Kanamori",
        "La magnitude des ondes de volume (MB) pour séismes profonds",
        "La magnitude locale de Richter (ML) pour séismes proches",
        "La magnitude des ondes de surface (MS) pour séismes superficiels"
    ],
    correct: 0,
    explanation: "La magnitude de moment sismique (Mw) est basée sur le moment sismique total. C'est la seule échelle utilisable pour tous les séismes, quelle que soit leur taille."
},
{
    question: "Pour quels types de séismes utilise-t-on la magnitude des ondes de surface (MS) ?",
    options: [
        "Pour les séismes intermédiaires uniquement entre 70 et 300 km",
        "Pour tous les types de séismes indistinctement sans exception",
        "Pour les séismes superficiels principalement moins de 70 km profondeur",
        "Pour les séismes profonds uniquement plus de 300 km de profondeur"
    ],
    correct: 2,
    explanation: "La magnitude des ondes de surface (MS) est basée sur l'amplitude des ondes de Rayleigh. Elle est utilisée principalement pour les séismes superficiels où les ondes de surface sont bien développées."
},
{
    question: "Pour quels types de séismes utilise-t-on la magnitude des ondes de volume (MB) ?",
    options: [
        "Pour les séismes volcaniques uniquement dans les zones actives",
        "Pour les séismes profonds, ondes P non affectées par profondeur",
        "Pour les séismes intermédiaires uniquement entre 70 et 300 km",
        "Pour les séismes superficiels uniquement moins de 70 km profondeur"
    ],
    correct: 1,
    explanation: "La magnitude des ondes de volume (MB) est basée sur l'amplitude des ondes P. Elle est adaptée aux séismes profonds car l'amplitude des ondes P n'est pas fortement affectée par la profondeur du foyer."

        let currentQuestion = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let userAnswers = [];
        let shuffledQuestions = [];

        // Fonction pour mélanger un tableau (algorithme de Fisher-Yates)
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialiser le quiz avec les questions mélangées
        function initQuiz() {
            shuffledQuestions = shuffleArray(questions);
            currentQuestion = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            userAnswers = [];
            loadQuestion();
        }

        function loadQuestion() {
            const question = shuffledQuestions[currentQuestion];
            const quizContent = document.getElementById('quizContent');
            
            quizContent.innerHTML = `
                <div class="question-block active">
                    <div class="question-number">Question ${currentQuestion + 1} sur ${shuffledQuestions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="options" id="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})">
                                <input type="radio" name="answer" id="option${index}" value="${index}">
                                <label for="option${index}">${option}</label>
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="buttons">
                        <button class="btn-validate" id="validateBtn" onclick="validateAnswer()" disabled>
                            ✓ Valider la réponse
                        </button>
                        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">
                            Question suivante →
                        </button>
                    </div>
                </div>
            `;
            
            updateProgress();
        }

        function selectOption(index) {
            document.querySelectorAll('.option').forEach(opt => {
                opt.style.background = '#f8f9fa';
                opt.style.borderColor = '#e0e0e0';
            });
            
            const selectedOption = document.querySelectorAll('.option')[index];
            selectedOption.style.background = '#f0f4ff';
            selectedOption.style.borderColor = '#667eea';
            
            document.getElementById(`option${index}`).checked = true;
            document.getElementById('validateBtn').disabled = false;
        }

        function validateAnswer() {
            const selectedOption = document.querySelector('input[name="answer"]:checked');
            if (!selectedOption) return;
            
            const userAnswer = parseInt(selectedOption.value);
            const question = shuffledQuestions[currentQuestion];
            const isCorrect = userAnswer === question.correct;
            
            userAnswers.push({
                question: currentQuestion,
                answer: userAnswer,
                correct: isCorrect
            });
            
            if (isCorrect) {
                correctAnswers++;
            } else {
                incorrectAnswers++;
            }
            
            const options = document.querySelectorAll('.option');
            options.forEach((opt, index) => {
                opt.style.pointerEvents = 'none';
                if (index === question.correct) {
                    opt.classList.add('correct');
                } else if (index === userAnswer && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });
            
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'incorrect');
            feedback.innerHTML = `
                <strong>${isCorrect ? '✓ Bonne réponse !' : '✗ Mauvaise réponse'}</strong>
                ${question.explanation}
            `;
            
            document.getElementById('validateBtn').style.display = 'none';
            document.getElementById('nextBtn').classList.add('show');
        }

        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} sur ${shuffledQuestions.length}`;
        }

        function showResults() {
            document.querySelector('.progress-container').style.display = 'none';
            document.getElementById('quizContent').style.display = 'none';
            
            const percentage = Math.round((correctAnswers / shuffledQuestions.length) * 100);
            document.getElementById('scoreCircle').textContent = percentage + '%';
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('incorrectCount').textContent = incorrectAnswers;
            document.getElementById('results').classList.add('show');
        }

        function restartQuiz() {
            document.querySelector('.progress-container').style.display = 'block';
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            
            initQuiz();
        }

        // Démarrer le quiz avec les questions mélangées
        initQuiz();
    </script>
