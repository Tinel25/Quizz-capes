          "Les Diatomées, qui libèrent des aiguilles de silice irritantes pour les branchies des poissons lors de leur lyse.", // Leurre (Dommage mécanique, pas marée rouge toxique classique)
          "Les Euglènes, qui consomment tout l'oxygène de l'eau la nuit et provoquent l'asphyxie de la faune locale.", // Leurre
          "Les Amibes, qui s'agrègent pour former des tapis visqueux étouffant les organismes benthiques fixés.", // Leurre
        ]
      },
      {
        question: "La conjugaison bactérienne diffère de la reproduction sexuée eucaryote car :",
        answers: [
          "C'est un transfert partiel et unidirectionnel d'ADN (plasmide) sans fusion de gamètes ni formation de zygote vrai.",
          "Elle est obligatoire avant chaque division cellulaire pour restaurer la taille du génome bactérien.", // Leurre
          "Elle ne permet pas de brassage génétique, les bactéries filles étant des clones parfaits de la bactérie donatrice.", // Leurre (Si, il y a brassage/nouveaux gènes)
          "Elle nécessite l'intervention d'un virus vecteur pour transporter l'ADN d'une bactérie à l'autre.", // Leurre (Transduction)
        ]
      }
    ];

    // --- MOTEUR DU QUIZ ---
    let currentQuestionIndex = 0;
    let score = 0;

    const quizBox = document.getElementById('quiz-box');
    const resultBox = document.getElementById('result-box');
    const questionTextElement = document.getElementById('question-text');
    const answerButtonsElement = document.getElementById('answer-buttons');
    const nextButton = document.getElementById('next-btn');
    const currentQSpan = document.getElementById('current-q');
    const totalQSpan = document.getElementById('total-q');
    const progressFill = document.getElementById('progress-fill');
    const finalScoreSpan = document.getElementById('final-score');
    const totalScoreSpan = document.getElementById('total-score');
    const feedbackMsg = document.getElementById('feedback-message');

    totalQSpan.innerText = quizData.length;

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      nextButton.style.display = "none";
      quizBox.style.display = "block";
      resultBox.style.display = "none";
      showQuestion();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function showQuestion() {
      resetState();
      let currentQuestion = quizData[currentQuestionIndex];
      currentQSpan.innerText = currentQuestionIndex + 1;
      
      let progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
      progressFill.style.width = progressPercent + "%";

      questionTextElement.innerText = currentQuestion.question;

      let answersToShuffle = [];
      currentQuestion.answers.forEach((answer, index) => {
          answersToShuffle.push({ text: answer, correct: index === 0 });
      });

      let shuffledAnswers = shuffleArray(answersToShuffle);

      shuffledAnswers.forEach(answerObj => {
        const button = document.createElement('button');
        button.innerText = answerObj.text;
        button.classList.add('answer-btn');
        if (answerObj.correct) button.dataset.correct = "true";
        button.addEventListener('click', selectAnswer);
        answerButtonsElement.appendChild(button);
      });
    }

    function resetState() {
      nextButton.style.display = "none";
      while (answerButtonsElement.firstChild) {
        answerButtonsElement.removeChild(answerButtonsElement.firstChild);
      }
    }

    function selectAnswer(e) {
      if (e.target.disabled) return;
      const selectedButton = e.target;
      const isCorrect = selectedButton.dataset.correct === "true";

      if (isCorrect) {
        selectedButton.classList.add('correct');
        score++;
      } else {
        selectedButton.classList.add('incorrect');
      }

      Array.from(answerButtonsElement.children).forEach(button => {
        button.disabled = true;
        if (button.dataset.correct === "true") {
            button.classList.add('correct');
        }
      });
      nextButton.style.display = "inline-block";
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
        quizBox.style.display = "none";
        resultBox.style.display = "block";
        progressFill.style.width = "100%";
        
        finalScoreSpan.innerText = score;
        totalScoreSpan.innerText = quizData.length;
        
        const percentage = (score / quizData.length) * 100;
        if(percentage >= 80) {
            feedbackMsg.innerText = "Excellent ! Le monde microbien est votre domaine.";
            feedbackMsg.style.color = "#38a169";
        } else if (percentage >= 50) {
            feedbackMsg.innerText = "Bon travail. Attention aux nuances métaboliques.";
            feedbackMsg.style.color = "#d69e2e";
        } else {
            feedbackMsg.innerText = "Continuez. Les unicellulaires sont la base de la vie, courage !";
            feedbackMsg.style.color = "#e53e3e";
        }
    }

    startQuiz();
  </script>
</body>
</html>
