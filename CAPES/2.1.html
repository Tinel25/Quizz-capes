          "Le Lombric : il utilise son cœlome comme une chambre respiratoire interne brassée par les mouvements du corps.", // Leurre
        ]
      },
      {
        question: "En termes de coût énergétique, lequel de ces modes respiratoires est le plus coûteux ?",
        answers: [
          "La ventilation branchiale dans l'eau, car il faut déplacer une masse importante d'un fluide dense et visqueux pour extraire peu d'O2.",
          "La ventilation pulmonaire chez les mammifères, à cause de la résistance élastique élevée du tissu pulmonaire.", // Leurre
          "La ventilation trachéenne chez les insectes, car la diffusion des gaz dans les tubes longs est très lente.", // Leurre
          "La respiration cutanée chez les amphibiens, car elle nécessite une production permanente de mucus protecteur.", // Leurre
        ]
      },
      {
        question: "La respiration des embryons d'Oiseaux (dans l'œuf) est assurée par :",
        answers: [
          "L'allantoïde, une annexe embryonnaire vascularisée qui s'accole à la coquille poreuse pour échanger les gaz par diffusion.",
          "Le sac vitellin, qui contient des réserves d'oxygène stockées par la mère lors de la formation de l'œuf.", // Leurre
          "Les branchies temporaires de l'embryon qui filtrent le liquide amniotique environnant.", // Leurre
          "L'amnios, dont le liquide circule activement grâce aux mouvements de l'embryon pour capter l'air extérieur.", // Leurre
        ]
      },
      {
        question: "Quelle affirmation est vraie concernant la respiration des Reptiles non aviens (ex: Tortue, Lézard) ?",
        answers: [
          "Ils ventilent par aspiration (dépression) grâce aux muscles intercostaux ou abdominaux, n'ayant pas de diaphragme musculaire complet.",
          "Ils possèdent une respiration cutanée aussi efficace que celle des amphibiens grâce à des écailles perméables.", // Leurre
          "Leur ventilation est unidirectionnelle comme celle des oiseaux, utilisant des sacs aériens abdominaux complexes.", // Leurre (C'est vrai pour croco/varan, mais pas généralisé/classique dans les QCM de base vs Oiseaux)
          "Ils doivent déglutir l'air comme les grenouilles car leur cage thoracique est rigide et immobile.", // Leurre
        ]
      }
    ];

    // --- MOTEUR DU QUIZ (Standardisé) ---
    let currentQuestionIndex = 0;
    let score = 0;

    const quizBox = document.getElementById('quiz-box');
    const resultBox = document.getElementById('result-box');
    const questionTextElement = document.getElementById('question-text');
    const answerButtonsElement = document.getElementById('answer-buttons');
    const nextButton = document.getElementById('next-btn');
    const currentQSpan = document.getElementById('current-q');
    const totalQSpan = document.getElementById('total-q');
    const progressFill = document.getElementById('progress-fill');
    const finalScoreSpan = document.getElementById('final-score');
    const totalScoreSpan = document.getElementById('total-score');
    const feedbackMsg = document.getElementById('feedback-message');

    totalQSpan.innerText = quizData.length;

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      nextButton.style.display = "none";
      quizBox.style.display = "block";
      resultBox.style.display = "none";
      showQuestion();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function showQuestion() {
      resetState();
      let currentQuestion = quizData[currentQuestionIndex];
      currentQSpan.innerText = currentQuestionIndex + 1;
      
      let progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
      progressFill.style.width = progressPercent + "%";

      questionTextElement.innerText = currentQuestion.question;

      let answersToShuffle = [];
      currentQuestion.answers.forEach((answer, index) => {
          answersToShuffle.push({ text: answer, correct: index === 0 });
      });

      let shuffledAnswers = shuffleArray(answersToShuffle);

      shuffledAnswers.forEach(answerObj => {
        const button = document.createElement('button');
        button.innerText = answerObj.text;
        button.classList.add('answer-btn');
        if (answerObj.correct) button.dataset.correct = "true";
        button.addEventListener('click', selectAnswer);
        answerButtonsElement.appendChild(button);
      });
    }

    function resetState() {
      nextButton.style.display = "none";
      while (answerButtonsElement.firstChild) {
        answerButtonsElement.removeChild(answerButtonsElement.firstChild);
      }
    }

    function selectAnswer(e) {
      if (e.target.disabled) return;
      const selectedButton = e.target;
      const isCorrect = selectedButton.dataset.correct === "true";

      if (isCorrect) {
        selectedButton.classList.add('correct');
        score++;
      } else {
        selectedButton.classList.add('incorrect');
      }

      Array.from(answerButtonsElement.children).forEach(button => {
        button.disabled = true;
        if (button.dataset.correct === "true") {
            button.classList.add('correct');
        }
      });
      nextButton.style.display = "inline-block";
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
        quizBox.style.display = "none";
        resultBox.style.display = "block";
        progressFill.style.width = "100%";
        
        finalScoreSpan.innerText = score;
        totalScoreSpan.innerText = quizData.length;
        
        const percentage = (score / quizData.length) * 100;
        if(percentage >= 80) {
            feedbackMsg.innerText = "Excellent ! La physiologie respiratoire est acquise.";
            feedbackMsg.style.color = "#38a169";
        } else if (percentage >= 50) {
            feedbackMsg.innerText = "Pas mal. Revoyez les courbes de dissociation de l'Hb.";
            feedbackMsg.style.color = "#d69e2e";
        } else {
            feedbackMsg.innerText = "Accrochez-vous. La respiration est un chapitre technique.";
            feedbackMsg.style.color = "#e53e3e";
        }
    }

    startQuiz();
  </script>
