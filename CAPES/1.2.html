<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz : Grandes fonctions chez les Embryophytes</title>
  <style>
    /* --- STYLE --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    }

    }

      display: inline-block;

      font-weight: bold;
    }

      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .answer-section {
      display: flex;
      flex-direction: column;
      gap: 15px; 
    }
    .answer-btn {
      width: 100%;
      min-height: 70px; 
      padding: 15px 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px; /* Police légèrement réduite pour les phrases longues */
      color: #333;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .answer-btn:hover:not([disabled]) {
        background: #f8f9fa;
        border-color: #667eea;
        transform: translateY(-2px);
    }
    .answer-btn.correct {
      background: #c6f6d5 !important;
      border-color: #38a169 !important;
      color: #22543d !important;
    }
    .answer-btn.incorrect {
      background: #fed7d7 !important;
      border-color: #e53e3e !important;
      color: #822727 !important;
    }
    .quiz-controls {
      margin-top: 30px;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }
    #next-btn {
      background: #764ba2;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: none;
    }
    .score-board { font-weight: bold; color: #764ba2; margin-bottom: 10px;}
    .progress-bar {
      width: 100%;
      height: 10px;
      background-color: #eee;
      border-radius: 5px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background-color: #667eea;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <a href="../index.html" class="back-link">← Retour au sommaire</a>
    
    <div class="header">
      <h1>Grandes fonctions chez quelques Embryophytes</h1>
    </div>

    <div id="quiz-box">
      <div class="score-board">Question <span id="current-q">1</span> / <span id="total-q">30</span></div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      
      <div class="question-section">
        <h2 id="question-text" class="question-text">Chargement...</h2>
      </div>

      <div id="answer-buttons" class="answer-section"></div>

      <div class="quiz-controls">
        <button id="next-btn" onclick="nextQuestion()">Question suivante</button>
      </div>
    </div>
    
    <div id="result-box" style="display: none; text-align: center;">
        <h2>Quiz terminé !</h2>
        <p style="font-size: 24px; margin: 20px 0;">Votre score : <span id="final-score"></span> / <span id="total-score"></span></p>
        <div id="feedback-message" style="margin-bottom: 20px; font-style: italic; color: #555;"></div>
        <button onclick="location.reload()" class="answer-btn" style="max-width: 200px; margin: 0 auto; background: #764ba2; color: white;">Recommencer</button>
    </div>

  </div>

  <script>
    // ============================================================
    // DONNÉES DU QUIZ - THÈME 1.2
    // Rappel : La 1ère réponse est la bonne (mélangée ensuite)
    // ============================================================
    
    const quizData = [
      // --- CIRCULATION & POTENTIELS ---

      {

          "Elle passe librement par la voie apoplastique à travers les parois cellulosiques.",

      },
      {

        ]
      },

      // --- PHOTOSYNTHÈSE & MÉTABOLISME ---
      {
        question: "Quel est l'avantage adaptatif majeur du métabolisme C4 par rapport au C3 ?",
        answers: [
          "Il réduit la photorespiration en concentrant le CO2 autour de la Rubisco dans la gaine périvasculaire.",
          "Il permet de réaliser la photosynthèse sans lumière grâce à l'accumulation d'acide malique.",
          "Il augmente l'ouverture des stomates pour maximiser la transpiration et le refroidissement.",
          "Il utilise l'oxygène comme accepteur d'électrons pour produire plus d'ATP."
        ]
      },
      {
        question: "Chez les plantes CAM (Crassulacean Acid Metabolism), quelle est la chronologie des échanges gazeux ?",
        answers: [
          "Ouverture des stomates la nuit pour fixer le CO2, fermeture le jour pour limiter les pertes d'eau.",
          "Ouverture des stomates le jour pour la photosynthèse, fermeture la nuit pour la respiration.",
          "Ouverture permanente des stomates mais fixation du CO2 uniquement la nuit.",
          "Fermeture permanente des stomates, les échanges se faisant par la cuticule."
        ]
      },
      {
        question: "Quelle est la fonction précise de la chaîne de transport d'électrons dans la phase claire ?",
        answers: [
          "Créer un gradient de protons dans le lumen du thylakoïde pour permettre la synthèse d'ATP.",
          "Fixer directement le CO2 atmosphérique sur le ribulose-1,5-bisphosphate.",
          "Hydrolyser l'ATP pour fournir de l'énergie à la réduction du NADP+.",
          "Convertir le glucose en amidon pour le stockage dans le stroma."
        ]
      },
      {
        question: "Quel est le rôle physiologique de la photorespiration ?",
        answers: [
          "Elle dissipe l'excès d'énergie lumineuse et protège les photosystèmes, bien qu'elle consomme de l'énergie.",
          "Elle produit du glucose supplémentaire lorsque la concentration en CO2 est très élevée.",
          "Elle permet à la plante de respirer en l'absence de mitochondries fonctionnelles.",
          "Elle génère de l'ATP sans produire de NADPH, utile pour le cycle de Calvin."
        ]
      },
      {
        question: "La Rubisco est une enzyme bifonctionnelle. Quelle réaction catalyse-t-elle en présence d'O2 ?",
        answers: [
          "L'oxygénation du RuBP, produisant du phosphoglycolate (2C) et du 3-PGA (3C).",
          "La carboxylation du PEP (Phosphoénolpyruvate) en oxaloacétate.",
          "La réduction du 3-PGA en glycéraldéhyde-3-phosphate.",
          "L'oxydation du NADPH pour régénérer le NADP+."
        ]
      },

      // --- DÉVELOPPEMENT & HORMONES ---
      {
        question: "Quel est le mécanisme cellulaire de l'ouverture des stomates induite par la lumière ?",
        answers: [
          "Pompage actif de H+ hors de la cellule, entrée de K+, baisse du potentiel hydrique et entrée d'eau.",
          "Sortie passive de K+ et de Cl-, augmentation du potentiel hydrique et sortie d'eau.",
          "Hydrolyse de l'amidon en glucose, ce qui augmente la pression osmotique et ferme le stomate.",
          "Synthèse d'acide abscissique (ABA) qui active directement les aquaporines membranaires."
        ]
      },
      {
        question: "Comment l'auxine induit-elle l'élongation cellulaire (hypothèse de la croissance acide) ?",
        answers: [
          "Elle active les pompes à protons, acidifiant la paroi et activant les expansines qui relâchent la cellulose.",
          "Elle pénètre dans le noyau et active directement la transcription des gènes de la mitose.",
          "Elle se lie aux microtubules corticaux pour orienter le dépôt de cellulose.",
          "Elle augmente la pression de turgescence en favorisant l'entrée massive de potassium."
        ]
      },
      {
        question: "Quel phytochrome est responsable de la détection de la lumière rouge clair (660 nm) pour la germination ?",
        answers: [
          "La forme Pr (inactif) qui se convertit en Pfr (actif) sous l'effet du rouge clair.",
          "La forme Pfr (actif) qui se convertit en Pr (inactif) sous l'effet du rouge clair.",
          "La cryptochrome bleue qui absorbe spécifiquement les longueurs d'onde rouges.",
          "La phototropine qui déclenche la phosphorylation des protéines membranaires."
        ]
      },
      {
        question: "L'éthylène est une phytohormone gazeuse connue pour déclencher :",
        answers: [
          "La triple réponse des plantules et la maturation des fruits climactériques.",
          "L'ouverture des stomates et la stimulation de la photosynthèse.",
          "L'élongation des entre-nœuds et la levée de dormance des graines.",
          "La différenciation du xylème et la rhizogenèse adventive."
        ]
      },
      {
        question: "Qu'est-ce que le gravitropisme positif de la racine et comment est-il perçu ?",
        answers: [
          "La croissance vers le bas, perçue par la sédimentation des statolithes dans la coiffe.",
          "La croissance vers le haut, perçue par la pression du cytoplasme sur la paroi.",
          "La croissance latérale, induite par la distribution asymétrique des cytokinines.",
          "La croissance vers l'eau, détectée par les variations de potentiel hydrique."
        ]
      },

      // --- NUTRITION MINÉRALE & SYMBIOSE ---
      {
        question: "Quel est le rôle principal des mycorhizes arbusculaires chez les plantes terrestres ?",
        answers: [
          "Augmenter la surface d'absorption pour le phosphore et l'eau en échange de sucres.",
          "Fixer l'azote atmosphérique pour le transférer directement à la plante hôte.",
          "Protéger les racines contre les attaques de nématodes par sécrétion de toxines.",
          "Dégrader la lignine du sol pour fournir du carbone organique à la plante."
        ]
      },
      {
        question: "Pourquoi la carence en magnésium se manifeste-t-elle par une chlorose des feuilles âgées ?",
        answers: [
          "Le magnésium est mobile dans le phloème et est remobilisé vers les jeunes feuilles en croissance.",
          "Le magnésium est immobile et reste piégé dans les feuilles sénescentes.",
          "Le magnésium est détruit par la lumière dans les vieilles feuilles.",
          "Le magnésium est toxique pour les jeunes feuilles et stocké dans les anciennes."
        ]
      },
      {
        question: "Lors de la fixation symbiotique de l'azote (Rhizobium), quelle molécule protège la nitrogénase de l'O2 ?",
        answers: [
          "La léghémoglobine, qui piège l'oxygène libre tout en le délivrant aux bactéries pour leur respiration.",
          "La flavonoïde, qui agit comme un antioxydant puissant dans le nodule.",
          "La nitrate réductase, qui consomme tout l'oxygène disponible avant qu'il n'atteigne l'enzyme.",
          "L'auxine, qui induit l'épaississement de la paroi des cellules du nodule."
        ]
      },

      // --- DIVERSITÉ & CYCLE DE VIE ---
      {
        question: "Quelle est la particularité de la double fécondation chez les Angiospermes ?",
        answers: [
          "Un spermatozoïde féconde l'oosphère (donnant le zygote) et l'autre féconde la cellule centrale (donnant l'albumen).",
          "Deux spermatozoïdes fécondent l'oosphère pour donner un zygote triploïde vigoureux.",
          "Un spermatozoïde féconde l'oosphère et l'autre dégénère pour nourrir l'embryon.",
          "La fécondation nécessite obligatoirement deux grains de pollen distincts."
        ]
      },
      {
        question: "Chez les Ptéridophytes (fougères), quelle est la phase dominante du cycle de vie ?",
        answers: [
          "Le sporophyte diploïde, qui est vascularisé et indépendant.",
          "Le gamétophyte haploïde, qui est la seule phase photosynthétique.",
          "Le gamétophyte diploïde, qui porte les sporanges.",
          "Le sporophyte haploïde, qui vit en parasite sur le gamétophyte."
        ]
      },
      {
        question: "Quelle innovation structurelle majeure distingue les Trachéophytes des Bryophytes ?",
        answers: [
          "La présence de tissus conducteurs lignifiés (xylème) permettant une taille plus importante.",
          "La capacité à réaliser la photosynthèse oxygénique.",
          "La présence d'une cuticule cireuse pour limiter la dessiccation.",
          "La protection de l'embryon dans un archégone multicellulaire."
        ]
      },
      {
        question: "Quel polymère est responsable de la rigidité mécanique du bois (xylème secondaire) ?",
        answers: [
          "La lignine, un polymère phénolique hydrophobe et résistant à la compression.",
          "La cellulose, un polymère de glucose formant des microfibrilles souples.",
          "La pectine, un polysaccharide gélatinisant présent dans la lamelle moyenne.",
          "La subérine, une substance cireuse imperméable présente dans le liège."
        ]
      },
      {
        question: "Qu'est-ce qu'une graine albuminée ?",
        answers: [
          "Une graine où les réserves sont stockées dans l'albumen (tissu triploïde) et non dans les cotylédons.",
          "Une graine qui ne contient pas d'albumen à maturité, les réserves étant dans l'embryon.",
          "Une graine riche en protéines (albumines) plutôt qu'en amidon.",
          "Une graine capable de germer sans lumière grâce à ses réserves lipidiques."
        ]
      },

      // --- ADAPTATIONS ---
      {
        question: "Les xérophytes (plantes de milieux secs) présentent souvent des stomates enfoncés dans des cryptes. Pourquoi ?",
        answers: [
          "Pour créer une atmosphère calme et humide (couche limite) qui réduit le gradient de diffusion de l'eau.",
          "Pour protéger les stomates contre les rayonnements UV intenses.",
          "Pour augmenter la surface d'échange gazeux disponible pour le CO2.",
          "Pour empêcher les insectes herbivores d'accéder aux cellules de garde."
        ]
      },
      {
        question: "Quelle est la fonction des pneumatophores chez les plantes de mangrove (ex: Avicennia) ?",
        answers: [
          "Permettre l'approvisionnement en oxygène des racines submergées dans la vase anoxique.",
          "Servir de flotteurs pour maintenir la stabilité de l'arbre lors des marées hautes.",
          "Excréter le sel excédentaire absorbé par les racines.",
          "Capter l'azote atmosphérique grâce à des associations bactériennes de surface."
        ]
      },
      {
        question: "Le thigmotropisme observé chez les vrilles (ex: Vigne) est dû à :",
        answers: [
          "Une croissance différentielle induite par le contact mécanique, souvent médiée par l'auxine.",
          "Une perte de turgescence rapide des cellules motrices du pulvinus.",
          "Une contraction active des protéines du cytosquelette de type actine-myosine.",
          "Une modification irréversible de la lignification sur la face interne."
        ]
      },
      {
        question: "L'abscission foliaire (chute des feuilles) en automne est déclenchée principalement par :",
        answers: [
          "Une diminution de l'auxine et une augmentation de l'éthylène dans la zone d'abscission.",
          "Une augmentation brutale de l'acide abscissique dans le pétiole.",
          "L'accumulation de déchets métaboliques toxiques dans la feuille.",
          "La gélification de la sève élaborée empêchant son évacuation."
        ]
      },
      {
        question: "Quelle structure permet aux Hépatiques (Bryophytes) de réguler sommairement les échanges gazeux ?",
        answers: [
          "Des pores aérifères fixes, qui ne peuvent pas se fermer activement comme les vrais stomates.",
          "Des stomates complexes avec cellules de garde et cellules annexes.",
          "Des lenticelles situées sur la tige principale.",
          "Elles n'ont aucune structure, les gaz diffusent à travers toute la paroi."
        ]
      },
      {
        question: "Quel est le rôle des bandes de Caspary subérifiées dans l'hypoderme racinaire (exoderme) ?",
        answers: [
          "Limiter les pertes d'eau vers le sol en période de sécheresse et constituer une barrière aux pathogènes.",
          "Assurer le transport actif des nutriments vers le cortex.",
          "Stocker l'eau de pluie absorbée rapidement par l'épiderme.",
          "Servir de site d'attachement pour les mycorhizes."
        ]
      },
      {
        question: "La vernalisation est un processus physiologique qui correspond à :",
        answers: [
          "L'acquisition de la capacité à fleurir après une exposition prolongée au froid.",
          "La levée de dormance des bourgeons par une exposition à la chaleur.",
          "La transformation des chloroplastes en chromoplastes lors de la maturation.",
          "La protection des tissus contre le gel par synthèse de sucres cryoprotecteurs."
        ]
      }
    ];

    // ============================================================
    // LOGIQUE DU QUIZ (Ne pas modifier)
    // ============================================================
    
    let currentQuestionIndex = 0;
    let score = 0;

    const questionTextElement = document.getElementById('question-text');
    const answerButtonsElement = document.getElementById('answer-buttons');
    const nextButton = document.getElementById('next-btn');
    const currentQSpan = document.getElementById('current-q');
    const totalQSpan = document.getElementById('total-q');
    const quizBox = document.getElementById('quiz-box');
    const resultBox = document.getElementById('result-box');
    const progressFill = document.getElementById('progress-fill');

    totalQSpan.innerText = quizData.length;

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      nextButton.style.display = "none";
      quizBox.style.display = "block";
      resultBox.style.display = "none";
      showQuestion();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function showQuestion() {
      resetState();
      let currentQuestion = quizData[currentQuestionIndex];
      currentQSpan.innerText = currentQuestionIndex + 1;
      
      let progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
      progressFill.style.width = progressPercent + "%";

      questionTextElement.innerText = currentQuestion.question;

      let answersToShuffle = [];
      currentQuestion.answers.forEach((answer, index) => {
          answersToShuffle.push({
              text: answer,
              correct: index === 0 
          });
      });

      let shuffledAnswers = shuffleArray(answersToShuffle);

      shuffledAnswers.forEach(answerObj => {
        const button = document.createElement('button');
        button.innerText = answerObj.text;
        button.classList.add('answer-btn');
        button.dataset.correct = answerObj.correct; 
        button.addEventListener('click', selectAnswer);
        answerButtonsElement.appendChild(button);
      });
    }

    function resetState() {
      nextButton.style.display = "none";
      while (answerButtonsElement.firstChild) {
        answerButtonsElement.removeChild(answerButtonsElement.firstChild);
      }
    }

    function selectAnswer(e) {
      const selectedButton = e.target;
      const isCorrect = selectedButton.dataset.correct === "true";

      if (isCorrect) {
        selectedButton.classList.add('correct');
        score++;
      } else {
        selectedButton.classList.add('incorrect');
      }

      Array.from(answerButtonsElement.children).forEach(button => {
        button.disabled = true;
        if (button.dataset.correct === "true") {
            button.classList.add('correct');
        }
      });

      nextButton.style.display = "inline-block";
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
        quizBox.style.display = "none";
        resultBox.style.display = "block";
        progressFill.style.width = "100%";
        
        const finalScoreSpan = document.getElementById('final-score');
        finalScoreSpan.innerText = score;
        document.getElementById('total-score').innerText = quizData.length;
        
        const feedback = document.getElementById('feedback-message');
        const percentage = (score / quizData.length) * 100;
        
        if(percentage >= 80) {
            feedback.innerText = "Excellent ! Vos connaissances sont solides et précises.";
            finalScoreSpan.style.color = "#38a169";
        } else if (percentage >= 50) {
            feedback.innerText = "Bon niveau global. Attention aux détails des mécanismes physiologiques.";
            finalScoreSpan.style.color = "#d69e2e";
        } else {
            feedback.innerText = "Continuez. Revoyez les cycles biologiques et la physiologie des transports.";
            finalScoreSpan.style.color = "#e53e3e";
        }
    }

    startQuiz();
  </script>
</body>
</html>
