          "Elle permet la respiration cutanée grâce à sa perméabilité sélective aux gaz respiratoires comme l'oxygène.", // Leurre (Généralement imperméable)
          "Elle stocke les réserves lipidiques nécessaires à la métamorphose et à la production des œufs.", // Leurre
          "Elle agit comme un organe sensoriel géant capable de détecter les variations de température et d'humidité." // Leurre (Ce sont les sensilles qui traversent la cuticule)
        ]
      },
      {
        question: "Chez les Échinodermes, à quoi servent les pédicellaires présents à la surface du corps ?",
        answers: [
          "Ce sont de petites pinces mobiles qui nettoient la surface du corps, éliminent les parasites et participent parfois à la défense.",
          "Ce sont des branchies dermiques qui augmentent la surface d'échange respiratoire avec l'eau de mer environnante.", // Leurre (Papules)
          "Ce sont des organes reproducteurs externes qui libèrent les gamètes dans la colonne d'eau lors de la reproduction.", // Leurre
          "Ce sont des ventouses hydrauliques puissantes qui permettent à l'animal de se fixer solidement au substrat rocheux." // Leurre (Podia)
        ]
      }
    ];

    // --- LOGIQUE DU QUIZ ---
    let currentQuestionIndex = 0;
    let score = 0;

    const quizBox = document.getElementById('quiz-box');
    const resultBox = document.getElementById('result-box');
    const questionTextElement = document.getElementById('question-text');
    const answerButtonsElement = document.getElementById('answer-buttons');
    const nextButton = document.getElementById('next-btn');
    const currentQSpan = document.getElementById('current-q');
    const totalQSpan = document.getElementById('total-q');
    const progressFill = document.getElementById('progress-fill');
    const finalScoreSpan = document.getElementById('final-score');
    const totalScoreSpan = document.getElementById('total-score');
    const feedbackMsg = document.getElementById('feedback-message');

    totalQSpan.innerText = quizData.length;

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      nextButton.style.display = "none";
      quizBox.style.display = "block";
      resultBox.style.display = "none";
      showQuestion();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function showQuestion() {
      resetState();
      let currentQuestion = quizData[currentQuestionIndex];
      currentQSpan.innerText = currentQuestionIndex + 1;
      
      let progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
      progressFill.style.width = progressPercent + "%";

      questionTextElement.innerText = currentQuestion.question;

      // Préparation des réponses (1ère = correcte)
      let answersToShuffle = [];
      currentQuestion.answers.forEach((answer, index) => {
          answersToShuffle.push({ text: answer, correct: index === 0 });
      });

      let shuffledAnswers = shuffleArray(answersToShuffle);

      shuffledAnswers.forEach(answerObj => {
        const button = document.createElement('button');
        button.innerText = answerObj.text;
        button.classList.add('answer-btn');
        if (answerObj.correct) button.dataset.correct = "true";
        button.addEventListener('click', selectAnswer);
        answerButtonsElement.appendChild(button);
      });
    }

    function resetState() {
      nextButton.style.display = "none";
      while (answerButtonsElement.firstChild) {
        answerButtonsElement.removeChild(answerButtonsElement.firstChild);
      }
    }

    function selectAnswer(e) {
      if (e.target.disabled) return; // Sécurité

      const selectedButton = e.target;
      const isCorrect = selectedButton.dataset.correct === "true";

      if (isCorrect) {
        selectedButton.classList.add('correct');
        score++;
      } else {
        selectedButton.classList.add('incorrect');
      }

      // Révéler la solution
      Array.from(answerButtonsElement.children).forEach(button => {
        button.disabled = true;
        if (button.dataset.correct === "true") {
            button.classList.add('correct');
        }
      });
      nextButton.style.display = "inline-block";
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
        quizBox.style.display = "none";
        resultBox.style.display = "block";
        progressFill.style.width = "100%";
        
        finalScoreSpan.innerText = score;
        totalScoreSpan.innerText = quizData.length;
        
        const percentage = (score / quizData.length) * 100;
        if(percentage >= 80) {
            feedbackMsg.innerText = "Excellent ! Maîtrise impressionnante de la zoologie.";
            feedbackMsg.style.color = "#38a169";
        } else if (percentage >= 50) {
            feedbackMsg.innerText = "Bon niveau. Révisez les détails des invertébrés.";
            feedbackMsg.style.color = "#d69e2e";
        } else {
            feedbackMsg.innerText = "Courage ! La diversité animale est vaste, reprenez les bases.";
            feedbackMsg.style.color = "#e53e3e";
        }
    }

    startQuiz();
  </script>
</body>
</html>
