<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L3 SVT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .header p {
      font-size: 16px;
      opacity: 0.9;
    }
    .content {
      padding: 30px;
    }
    .dropdown {
      margin-bottom: 20px;
    }
    .dropdown button {
      width: 100%;
      text-align: left;
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .dropdown button:hover {
      border-color: #667eea;
      background: #f0f4ff;
    }
    .dropdown-content {
      display: none;
      margin-top: 10px;
      margin-left: 20px;
    }
    .dropdown-content a {
      display: block;
      text-decoration: none;
      color: #333;
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 10px 14px;
      transition: all 0.3s ease;
      margin-bottom: 8px;
    }
    .dropdown-content a:hover {
      border-color: #667eea;
      background: #f0f4ff;
      transform: translateX(5px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Bonne révision !</h1>
      <p>Choisis ta matière</p>
    </div>
    <div class="content">
      
      <div class="dropdown">
        <button onclick="toggleDropdown('immuno')">Immunologie ▼</button>
        <div id="immuno" class="dropdown-content">
          <a href="Immunologie/Notion_d_Antigene.html">Notion d'Antigène</a>
          <a href="biologie/quiz2.html">Quiz 2 : x</a>
        </div>
      </div>

      <div class="dropdown">
        <button onclick="toggleDropdown('nmh')">NMH ▼</button>
        <div id="nmh" class="dropdown-content">
          <a href="informatique/quiz1.html">Quiz 1 : x</a>
          <a href="informatique/quiz2.html">Quiz 2 : x</a>
        </div>
      </div>

      <div class="dropdown">
        <button onclick="toggleDropdown('dyn')">DTS ▼</button>
        <div id="dyn" class="dropdown-content">
          <a href="DTS/cinematique.html">Tectonique globale et cinématique des plaques</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    function toggleDropdown(id) {
      const content = document.getElementById(id);
      content.style.display = (content.style.display === "block") ? "none" : "block";
    }
  </script>
</body>
</html>
