<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Sportif Personnel</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TEAMS = {
            lille: { name: "Lille", id: "lille", badgeColor: "bg-red-600" },
            metz: { name: "Metz", id: "metz", badgeColor: "bg-orange-600" },
            saint_etienne: { name: "Saint-Étienne", id: "saint_etienne", badgeColor: "bg-green-700" }
        };

        const EXERCISES_CONFIG = {
            pompes: { name: "Pompes", icon: "💪", unit: "répétitions", levels: { debutant: { min: 5, max: 999 }, intermediaire: { min: 15, max: 999 }, pro: { min: 30, max: 999 } } },
            gainage: { name: "Gainage", icon: "🧘", unit: "secondes", levels: { debutant: { min: 20, max: 999 }, intermediaire: { min: 40, max: 999 }, pro: { min: 90, max: 999 } } },
            crunch: { name: "Crunch", icon: "🔥", unit: "répétitions", levels: { debutant: { min: 10, max: 999 }, intermediaire: { min: 20, max: 999 }, pro: { min: 40, max: 999 } } },
            squats: { name: "Squats", icon: "🦵", unit: "répétitions", levels: { debutant: { min: 10, max: 999 }, intermediaire: { min: 20, max: 999 }, pro: { min: 40, max: 999 } } }
        };

        const LEVELS = {
            debutant: { name: "Débutant", description: "Je débute", icon: "🌱" },
            intermediaire: { name: "Intermédiaire", description: "Régulier", icon: "💪" },
            pro: { name: "Pro", description: "Très actif", icon: "🔥" }
        };

        const getMondayDate = (d) => {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1); 
            const monday = new Date(date.setDate(diff));
            monday.setHours(0, 0, 0, 0);
            return monday.toISOString().split('T')[0];
        };

        function FitnessTracker() {
            const [username, setUsername] = useState(localStorage.getItem('fitness_username') || '');
            const [password, setPassword] = useState(localStorage.getItem('fitness_password') || '');
            const [tempUsername, setTempUsername] = useState('');
            const [tempPassword, setTempPassword] = useState('');
            const [userData, setUserData] = useState(null);
            const [setupStep, setSetupStep] = useState('team');
            const [selectedTeam, setSelectedTeam] = useState('');
            const [selectedExercises, setSelectedExercises] = useState([]);
            const [exerciseLevels, setExerciseLevels] = useState({});
            const [completedExercises, setCompletedExercises] = useState(new Set());
            const [exerciseProgress, setExerciseProgress] = useState({});
            const [showConfirmation, setShowConfirmation] = useState(false);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);

            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const [isMaintenance, setIsMaintenance] = useState(false);
            const isAdmin = username.toLowerCase() === 'tinel25';

            const getTodayDate = () => {
                const now = new Date();
                now.setHours(now.getHours() - 2); 
                return now.toISOString().split('T')[0];
            };

            const checkMaintenance = async () => {
                try {
                    const response = await fetch('/api/user-data?action=getStatus');
                    if (response.ok) {
                        const data = await response.json();
                        setIsMaintenance(data.maintenanceMode);
                        if (data.maintenanceMode && username && username.toLowerCase() !== 'tinel25') {
                            window.location.href = 'maintenance.html';
                        }
                    }
                } catch (e) {}
            };

            const toggleMaintenance = async () => {
                const newState = !isMaintenance;
                if (!confirm(newState ? "Bloquer l'accès aux autres ?" : "Rétablir l'accès ?")) return;
                try {
                    await fetch('/api/user-data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'setMaintenance', admin: username, state: newState })
                    });
                    setIsMaintenance(newState);
                } catch (e) { alert("Erreur serveur"); }
            };

            const loadMessages = async () => {
                try {
                    const response = await fetch('/api/messages');
                    if (response.ok) setMessages(await response.json());
                } catch (e) {}
            };

            const sendMessage = async () => {
                if (!newMessage.trim()) return;
                const msg = { id: Date.now(), username, text: newMessage, date: new Date().toISOString(), team: userData?.team || 'lille' };
                try {
                    await fetch('/api/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'add', message: msg })
                    });
                    setNewMessage('');
                    loadMessages();
                } catch (e) {}
            };

            const deleteMessage = async (id) => {
                if (!isAdmin || !confirm("Supprimer ?")) return;
                try {
                    await fetch('/api/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'delete', id, admin: username })
                    });
                    loadMessages();
                } catch (e) {}
            };

            useEffect(() => {
                checkMaintenance();
                if (username && password) {
                    loadUserData();
                    loadMessages();
                    
                    // ARCHIVAGE AUTOMATIQUE DU MOIS PRÉCÉDENT (Admin uniquement)
                    if (isAdmin) {
                        fetch('/.netlify/functions/victoires').catch(() => {});
                    }

                    const interval = setInterval(() => { 
                        loadMessages(); 
                        checkMaintenance(); 
                    }, 10000);
                    return () => clearInterval(interval);
                } else { setLoading(false); }
            }, [username, password]);

            useEffect(() => {
                if (userData && username) {
                    const today = getTodayDate();
                    const currentMonday = getMondayDate(new Date());
                    let newUserData = { ...userData };
                    let needsUpdate = false;
                    if (newUserData.jokersAvailable === undefined || newUserData.lastJokerReset !== currentMonday) {
                        newUserData.jokersAvailable = 1;
                        newUserData.lastJokerReset = currentMonday;
                        needsUpdate = true;
                    }
                    if (needsUpdate) { saveUserData(newUserData); setUserData(newUserData); }
                    const saved = localStorage.getItem(`progress_${username}_${today}`);
                    setExerciseProgress(saved ? JSON.parse(saved) : {});
                }
            }, [userData, username]);

            const saveExerciseProgress = (ex, amount, max) => {
                const today = getTodayDate();
                const newVal = Math.min((exerciseProgress[ex] || 0) + amount, max);
                const newProgress = { ...exerciseProgress, [ex]: newVal };
                setExerciseProgress(newProgress);
                localStorage.setItem(`progress_${username}_${today}`, JSON.stringify(newProgress));
            };

            const setSpecificProgress = (ex, val, max) => {
                const today = getTodayDate();
                const v = Math.min(Math.max(parseInt(val) || 0, 0), max);
                const newProgress = { ...exerciseProgress, [ex]: v };
                setExerciseProgress(newProgress);
                localStorage.setItem(`progress_${username}_${today}`, JSON.stringify(newProgress));
            };

            const resetExerciseProgress = (ex) => {
                const today = getTodayDate();
                const newProgress = { ...exerciseProgress }; delete newProgress[ex];
                setExerciseProgress(newProgress);
                localStorage.setItem(`progress_${username}_${today}`, JSON.stringify(newProgress));
            };

            const handleLogin = async () => {
                const trimmedU = tempUsername.trim().toLowerCase();
                const trimmedP = tempPassword.trim();
                if (isMaintenance && trimmedU !== 'tinel25') {
                    window.location.href = 'maintenance.html';
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch('/api/user-data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'auth', username: trimmedU, password: trimmedP })
                    });
                    if (response.ok) {
                        localStorage.setItem('fitness_username', trimmedU);
                        localStorage.setItem('fitness_password', trimmedP);
                        setUsername(trimmedU); setPassword(trimmedP);
                        setUserData(await response.json());
                    } else setError('Erreur connexion');
                } catch (e) { setError('Erreur serveur'); }
                finally { setLoading(false); }
            };

            const handleLogout = () => { localStorage.clear(); window.location.reload(); };

            const loadUserData = async () => {
                try {
                    const r = await fetch(`/api/user-data?username=${username}`);
                    if (r.ok) setUserData(await r.json());
                    else if (r.status === 404) handleLogout();
                } catch (e) {} finally { setLoading(false); }
            };

            const saveUserData = async (data) => {
                try {
                    await fetch(`/api/user-data?username=${username}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, ...data })
                    });
                    return true;
                } catch (e) { return false; }
            };

            const resetProgress = async () => {
                const newData = { ...userData, team: null, level: null, exercises: [], targets: {}, exerciseStats: {}, monthlyHistory: {}, streak: 0, totalDays: 0, lastCheckDate: null, history: [] };
                if (await saveUserData(newData)) setUserData(newData);
            };

            const handleCompleteSetup = async () => {
                const targets = {};
                selectedExercises.forEach(ex => targets[ex] = EXERCISES_CONFIG[ex].levels[exerciseLevels[ex]].min);
                const newData = { team: selectedTeam, exercises: selectedExercises, level: exerciseLevels, targets, exerciseStats: {}, monthlyHistory: {}, streak: 0, totalDays: 0, lastCheckDate: null, history: [], jokersAvailable: 1, lastJokerReset: getMondayDate(new Date()) };
                if (await saveUserData(newData)) setUserData(newData);
            };

            const checkMissedDays = () => {
                if (!userData?.lastCheckDate) return 0;
                const last = new Date(userData.lastCheckDate);
                const now = new Date(); now.setHours(now.getHours() - 2);
                const diff = Math.floor((new Date(now).setHours(0,0,0,0) - new Date(last).setHours(0,0,0,0)) / 86400000);
                return Math.max(0, diff - 1);
            };

            const applyPenalties = (t) => {
                const missed = checkMissedDays();
                if (missed === 0) return t;
                const pen = { ...t };
                userData.exercises.forEach(ex => {
                    const lvl = (typeof userData.level === 'string') ? userData.level : userData.level[ex];
                    let v = pen[ex];
                    for (let i = 0; i < missed; i++) v = Math.round(v * 0.85);
                    pen[ex] = Math.max(v, EXERCISES_CONFIG[ex].levels[lvl].min);
                });
                return pen;
            };

            const handleUseJoker = async () => {
                if (userData.jokersAvailable <= 0 || !confirm("🃏 Joker ?")) return;
                const today = getTodayDate();
                const newData = { ...userData, jokersAvailable: userData.jokersAvailable - 1, streak: userData.streak + 1, totalDays: userData.totalDays + 1, lastCheckDate: today, history: [{ date: today, success: true, isJoker: true, completed: ["JOKER"], targets: {...userData.targets} }, ...userData.history].slice(0, 5) };
                if (await saveUserData(newData)) { setUserData(newData); setExerciseProgress({}); }
            };

            const validateDay = async () => {
                const today = getTodayDate();
                const month = new Date().toLocaleString('fr-FR', { month: 'long' });
                const targetsToday = applyPenalties(userData.targets);
                let newT = { ...targetsToday };
                const newStats = { ...userData.exerciseStats };
                const newM = { ...(userData.monthlyHistory || {}) };
                if (!newM[month]) newM[month] = {};
                userData.exercises.forEach(ex => {
                    const lvl = (typeof userData.level === 'string') ? userData.level : userData.level[ex];
                    let d = exerciseProgress[ex] || 0;
                    if (completedExercises.has(ex) && d === 0) d = targetsToday[ex];
                    d = Math.min(d, targetsToday[ex]);
                    newM[month][ex] = (newM[month][ex] || 0) + d;
                    if (!newStats[ex]) newStats[ex] = { successCount: 0, totalAttempts: 0 };
                    newStats[ex].totalAttempts += 1;
                    if (completedExercises.has(ex) && d >= targetsToday[ex]) {
                        newStats[ex].successCount += 1;
                        newT[ex] = Math.min(Math.round(newT[ex] * 1.1), EXERCISES_CONFIG[ex].levels[lvl].max);
                    } else newT[ex] = Math.max(Math.round(newT[ex] * 0.85), EXERCISES_CONFIG[ex].levels[lvl].min);
                });
                const newData = { ...userData, targets: newT, exerciseStats: newStats, monthlyHistory: newM, streak: (checkMissedDays() > 0) ? 1 : userData.streak + 1, totalDays: userData.totalDays + 1, lastCheckDate: today, history: [{ date: today, success: completedExercises.size === userData.exercises.length, completed: Array.from(completedExercises), targets: {...targetsToday} }, ...userData.history].slice(0, 5) };
                if (await saveUserData(newData)) { setUserData(newData); setCompletedExercises(new Set()); setExerciseProgress({}); setShowConfirmation(false); }
            };

            if (!username || !password) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-600 to-purple-700 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl p-8 max-w-md w-full">
                            <h1 className="text-3xl font-bold text-center mb-8">🏋️ Coach Sportif</h1>
                            {error && <div className="bg-red-100 text-red-700 p-3 rounded mb-4 font-bold">{error}</div>}
                            <div className="space-y-4">
                                <input type="text" value={tempUsername} onChange={(e)=>setTempUsername(e.target.value)} placeholder="Pseudo" className="w-full p-3 border-2 rounded-lg outline-none focus:border-blue-500"/>
                                <input type="password" value={tempPassword} onChange={(e)=>setTempPassword(e.target.value)} placeholder="Date de naissance Jour/Mois" className="w-full p-3 border-2 rounded-lg outline-none focus:border-blue-500"/>
                                <button onClick={handleLogin} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Commencer 🚀</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (loading || !userData) return <div className="min-h-screen bg-blue-600 flex items-center justify-center text-white text-2xl">Chargement...</div>;

            if (!userData.team || !userData.level) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-600 to-purple-700 p-4">
                        <div className="max-w-4xl mx-auto bg-white rounded-2xl p-8">
                            {setupStep === 'team' && (
                                <>
                                    <h2 className="text-2xl font-bold mb-6 text-center">D'où viens-tu ?</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                        {Object.values(TEAMS).map(t => (
                                            <button key={t.id} onClick={()=>setSelectedTeam(t.id)} className={`p-6 border-4 rounded-xl font-bold ${selectedTeam === t.id ? 'border-blue-500 bg-blue-50' : 'border-gray-100'}`}>{t.name}</button>
                                        ))}
                                    </div>
                                    <button onClick={()=>setSetupStep('exercises')} disabled={!selectedTeam} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold disabled:opacity-50">Continuer</button>
                                </>
                            )}
                            {setupStep === 'exercises' && (
                                <>
                                    <h2 className="text-2xl font-bold mb-6 text-center">Tes exercices ?</h2>
                                    <div className="grid grid-cols-2 gap-4 mb-8">
                                        {Object.entries(EXERCISES_CONFIG).map(([k,v]) => (
                                            <button key={k} onClick={()=>{setSelectedExercises(p=>p.includes(k)?p.filter(x=>x!==k):[...p,k])}} className={`p-4 border-2 rounded-xl ${selectedExercises.includes(k)?'border-blue-500 bg-blue-50':'border-gray-200'}`}>{v.icon} {v.name}</button>
                                        ))}
                                    </div>
                                    <button onClick={()=>setSetupStep('level')} disabled={!selectedExercises.length} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold disabled:opacity-50">Suivant</button>
                                </>
                            )}
                            {setupStep === 'level' && (
                                <>
                                    <h2 className="text-2xl font-bold mb-6 text-center">Tes niveaux ?</h2>
                                    <div className="space-y-4 mb-8 max-h-64 overflow-y-auto">
                                        {selectedExercises.map(ex => (
                                            <div key={ex} className="p-4 bg-gray-50 border rounded-xl">
                                                <div className="font-bold mb-2">{EXERCISES_CONFIG[ex].icon} {EXERCISES_CONFIG[ex].name}</div>
                                                <div className="grid grid-cols-3 gap-2">
                                                    {Object.keys(LEVELS).map(l => (
                                                        <button key={l} onClick={()=>setExerciseLevels(p=>({...p,[ex]:l}))} className={`py-2 border-2 rounded-lg text-xs ${exerciseLevels[ex]===l?'border-blue-500 bg-blue-100':'bg-white'}`}>{LEVELS[l].name}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={handleCompleteSetup} disabled={Object.keys(exerciseLevels).length < selectedExercises.length} className="w-full bg-green-600 text-white py-3 rounded-lg font-bold disabled:opacity-50">C'est parti ! 🚀</button>
                                </>
                            )}
                        </div>
                    </div>
                );
            }

            const todayDate = getTodayDate();
            const canValidate = userData.lastCheckDate !== todayDate;
            const targetPenalty = applyPenalties(userData.targets);

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-600 to-purple-700 p-2 md:p-4">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-xl p-4 md:p-6 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
                            <div className="text-center md:text-left">
                                <h1 className="text-2xl md:text-3xl font-bold flex flex-wrap justify-center md:justify-start items-center gap-2">
                                    {username}
                                    <span className={`text-[10px] md:text-sm px-3 py-1 rounded-full text-white ${TEAMS[userData.team]?.badgeColor}`}>📍 {TEAMS[userData.team]?.name}</span>
                                </h1>
                                <p className="text-gray-600 text-sm">Série: {userData.streak} 🔥 | Joker: {userData.jokersAvailable || 0} 🃏</p>
                            </div>
                            <div className="flex flex-wrap justify-center gap-2 w-full md:w-auto">
                                {isAdmin && (
                                    <button onClick={toggleMaintenance} className={`px-3 py-2 rounded-lg text-[10px] font-bold uppercase text-white ${isMaintenance ? 'bg-red-600 animate-pulse' : 'bg-green-500'}`}>
                                        {isMaintenance ? '🔓 Finir MAJ' : '🔒 Mode MAJ'}
                                    </button>
                                )}
                                <a href="classement.html" className="bg-yellow-500 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center">🏆</a>
                                <button onClick={handleLogout} className="bg-gray-500 text-white px-4 py-2 rounded-lg text-sm flex-1 md:flex-none">Déconnexion</button>
                                <button onClick={() => confirm('Réinitialiser tout ton profil ?') && resetProgress()} className="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1 md:flex-none">Reset</button>
                            </div>
                        </div>

                        {!canValidate ? (
                            <div className="bg-white rounded-2xl p-10 text-center shadow-xl">
                                <div className="text-6xl mb-4">✅</div>
                                <h2 className="text-2xl font-bold">Journée validée ! Reviens demain 💪</h2>
                            </div>
                        ) : (
                            <div className="bg-white rounded-2xl p-4 md:p-6 shadow-xl mb-6">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                                    <h2 className="text-2xl font-bold text-center md:text-left">Objectifs du jour 🎯</h2>
                                    {userData.jokersAvailable > 0 && <button onClick={handleUseJoker} className="w-full md:w-auto bg-purple-600 text-white px-4 py-2 rounded-lg font-bold text-sm">🃏 Utiliser Joker</button>}
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {userData.exercises.map(ex => {
                                        const c = EXERCISES_CONFIG[ex];
                                        const t = targetPenalty[ex];
                                        const isDone = completedExercises.has(ex);
                                        return (
                                            <div key={ex} className={`p-4 md:p-6 border-2 rounded-2xl ${isDone ? 'border-green-500 bg-green-50' : 'border-gray-200 bg-white'}`}>
                                                <div className="flex items-center gap-4 mb-4">
                                                    <div className="text-4xl md:text-5xl">{c.icon}</div>
                                                    <div>
                                                        <div className="font-bold text-base md:text-lg">{c.name}</div>
                                                        <div className="text-2xl md:text-3xl font-black text-blue-600">{t} <span className="text-xs font-normal text-gray-500 uppercase">{c.unit}</span></div>
                                                    </div>
                                                </div>
                                                {!isDone && (
                                                    <div className="space-y-4">
                                                        <div className="flex gap-2">
                                                            <input type="number" value={exerciseProgress[ex] || ''} onChange={(e)=>setSpecificProgress(ex, e.target.value, t)} className="flex-1 p-2 border rounded font-bold text-center" placeholder="Score"/>
                                                            <button onClick={()=>resetExerciseProgress(ex)} className="text-xs text-red-500">Effacer</button>
                                                        </div>
                                                        <div className="grid grid-cols-4 gap-2">
                                                            {[1, 5, 10, t].map(v => <button key={v} onClick={()=>saveExerciseProgress(ex, v, t)} className="bg-blue-100 text-blue-700 font-bold py-2 rounded-lg text-[10px] md:text-xs">+{v}</button>)}
                                                        </div>
                                                        <button onClick={()=>setCompletedExercises(p => new Set(p).add(ex))} className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold">Je l'ai fait !</button>
                                                    </div>
                                                )}
                                                {isDone && <button onClick={()=>setCompletedExercises(p=>{const n=new Set(p); n.delete(ex); return n;})} className="w-full py-2 bg-white text-green-600 border-2 border-green-200 rounded-lg font-bold">Annuler</button>}
                                            </div>
                                        );
                                    })}
                                </div>
                                <button onClick={()=>setShowConfirmation(true)} className="w-full py-4 rounded-2xl font-black text-lg md:text-xl shadow-lg mt-8 bg-gray-800 text-white">VALIDER LA JOURNÉE 🚀</button>
                            </div>
                        )}

                        {showConfirmation && (
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl p-8 max-w-sm w-full">
                                    <h2 className="text-2xl font-bold text-center mb-6">Confirmer ?</h2>
                                    <div className="flex gap-4">
                                        <button onClick={()=>setShowConfirmation(false)} className="flex-1 bg-gray-500 text-white py-3 rounded-lg font-bold">Retour</button>
                                        <button onClick={validateDay} className="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold">Confirmer</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-2xl p-6 mb-6 shadow-xl">
                            <h3 className="font-bold text-gray-800 mb-3">Comment ça marche ? 💡</h3>
                            <ul className="space-y-1 text-gray-600 text-sm">
                                <li>✓ Réussite : +10% sur l'exercice</li>
                                <li>✗ Échec : -15% pour se relancer</li>
                                <li>📍 Tes scores aident ton équipe !</li>
                            </ul>
                        </div>

                        <div className="bg-white rounded-2xl shadow-xl p-6 border-t-4 border-blue-500">
                            <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">💬 Tchat Collectif</h2>
                            <div className="h-64 overflow-y-auto mb-4 p-4 bg-gray-50 rounded-xl flex flex-col-reverse chat-container">
                                {[...messages].reverse().map((msg) => (
                                    <div key={msg.id} className="bg-white p-3 rounded-lg shadow-sm border border-gray-100 mb-2 relative group">
                                        <div className="flex justify-between items-start mb-1">
                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded text-white ${TEAMS[msg.team]?.badgeColor || 'bg-gray-400'}`}>
                                                {msg.username}
                                            </span>
                                            <span className="text-[10px] text-gray-400">
                                                {new Date(msg.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                            </span>
                                        </div>
                                        <p className="text-sm text-gray-700">{msg.text}</p>
                                        {isAdmin && (
                                            <button onClick={() => deleteMessage(msg.id)} className="absolute top-1 right-1 opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 text-xs">🗑️</button>
                                        )}
                                    </div>
                                ))}
                            </div>
                            <div className="flex gap-2">
                                <input type="text" value={newMessage} onChange={(e)=>setNewMessage(e.target.value)} onKeyPress={(e)=>e.key==='Enter'&&sendMessage()} placeholder="Un message ?" className="flex-1 border rounded-xl px-4 py-2 text-sm outline-none focus:border-blue-500"/>
                                <button onClick={sendMessage} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-blue-700 transition-colors">Envoyer</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FitnessTracker />);
    </script>
</body>
</html>
