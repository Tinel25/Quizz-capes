
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climato/Paléo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .btn-back {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) translateX(-3px);
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .progress-container {
            background: #f0f0f0;
            padding: 20px 30px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            margin-top: 10px;
            text-align: center;
            color: #666;
            font-weight: 600;
        }
        
        .quiz-content {
            padding: 30px;
        }
        
        .question-block {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .question-block.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(5px);
        }
        
        .option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .option label {
            cursor: pointer;
            flex: 1;
            font-size: 16px;
            color: #333;
        }
        
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.correct {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
        }
        
        .feedback.incorrect {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }
        
        .feedback strong {
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }
        
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }
        
        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-validate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }
        
        .btn-validate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-validate:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-next {
            background: #28a745;
            color: white;
            display: none;
        }
        
        .btn-next:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        
        .btn-next.show {
            display: block;
        }
        
        .results {
            display: none;
            text-align: center;
            padding: 40px 30px;
        }
        
        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        .results h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
        }
        
        .score-circle {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .results-details {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        
        .result-item {
            text-align: center;
        }
        
        .result-item .number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .result-item .label {
            color: #666;
            font-size: 14px;
        }
        
        .result-item.correct .number {
            color: #28a745;
        }
        
        .result-item.incorrect .number {
            color: #dc3545;
        }
        
        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 30px;
            padding: 16px 40px;
        }
        
        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .btn-back {
                position: static;
                transform: none;
                display: inline-block;
                margin-bottom: 15px;
            }
            
            .btn-back:hover {
                transform: translateX(-3px);
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .question-text {
                font-size: 18px;
            }
            
            .option label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="btn-back">← Retour à l'accueil</a>
            <h1>Climato/Paléo</h1>
            <p>Introduction</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Question 1 sur 70</div>
        </div>
        
        <div class="quiz-content" id="quizContent"></div>
        
        <div class="results" id="results">
            <h2>🎉 Quiz Terminé !</h2>
            <div class="score-circle" id="scoreCircle"></div>
            <div class="results-details">
                <div class="result-item correct">
                    <div class="number" id="correctCount">0</div>
                    <div class="label">Bonnes réponses</div>
                </div>
                <div class="result-item incorrect">
                    <div class="number" id="incorrectCount">0</div>
                    <div class="label">Mauvaises réponses</div>
                </div>
            </div>
            <button class="btn-restart" onclick="restartQuiz()">🔄 Recommencer le quiz</button>
        </div>
    </div>

    <script>
        const questions = [
           {
    question: "Quand le chien a-t-il été domestiqué ?",
    options: [
        "Il y a environ 5 000 ans en Égypte, à partir du chacal doré",
        "Il y a environ 15 000 ans, bien avant tout autre animal, à partir du loup gris",
        "Il y a environ 20 000 ans en Amérique du Sud, à partir du renard",
        "Il y a environ 8 000 ans au Moyen-Orient, à partir du loup d'Arabie"
    ],
    correct: 1,
    explanation: "Le chien a été domestiqué il y a environ 15 000 ans, bien avant n'importe quel autre animal, à partir du loup gris."
},
{
    question: "Quels sont les deux prérequis essentiels pour la domestication des animaux ?",
    options: [
        "Être carnivore et avoir une grande taille pour la chasse",
        "Être herbivore et avoir un pelage épais pour la laine",
        "Vivre en solitaire et être agressif envers les prédateurs",
        "Vivre en densités élevées et se reproduire en présence de l'Homme"
    ],
    correct: 3,
    explanation: "Les prérequis pour la domestication sont : vivre à des densités de population importantes (en groupe) et se reproduire en présence de l'Homme (en captivité)."
},
{
    question: "Pourquoi le loup et l'Homme ont-ils pu former un partenariat naturel ?",
    options: [
        "Car ils occupaient la même guilde et avaient des organisations sociales similaires",
        "Car ils avaient peur des mêmes prédateurs et chassaient ensemble",
        "Car le loup était naturellement docile et non-agressif envers l'Homme",
        "Car l'Homme pouvait nourrir facilement le loup avec ses restes"
    ],
    correct: 0,
    explanation: "Homme et loup occupaient la même guilde (groupe fonctionnel) avec des sociabilités complexes et des organisations proches, ce qui a permis un mutualisme dans la chasse."
},
{
    question: "Quel impact majeur la domestication du chien a-t-elle eu sur l'histoire humaine ?",
    options: [
        "Uniquement la compagnie et le divertissement pour les groupes humains",
        "Seulement la protection des campements contre les animaux sauvages",
        "Meilleurs succès de chasse (×3), protéines accrues et conséquences sur l'hominisation",
        "Aucun impact significatif sur l'évolution ou la culture humaine"
    ],
    correct: 2,
    explanation: "La domestication du chien a permis de meilleurs succès de chasse (3 fois plus de gibier), un apport accru de protéines, une augmentation du volume cérébral et aurait été un élément-clé dans l'origine de plusieurs civilisations."
},
{
    question: "Quels bénéfices les biotechnologies modernes peuvent-elles apporter à l'agriculture ?",
    options: [
        "Uniquement augmenter la taille des fruits pour une meilleure commercialisation",
        "Seulement améliorer le goût des légumes pour les consommateurs",
        "Uniquement réduire les coûts de production pour les agriculteurs",
        "Diminution ressources énergétiques, résistance parasites, tolérance stress, optimisation minéraux"
    ],
    correct: 3,
    explanation: "Les biotechnologies modernes apportent de nombreux bénéfices : diminution de l'utilisation des ressources énergétiques, optimisation de l'assimilation des éléments minéraux, résistance aux parasites et ravageurs, tolérance aux herbicides et aux stress environnementaux, et stérilité génétique."
},
{
    question: "Qu'est-ce qu'une 'lignée domestiquée' ?",
    options: [
        "Groupe d'individus avec performances, apparence et histoire sélective uniformes selon sélections humaines",
        "Un groupe d'animaux sauvages vivant à proximité des habitations humaines",
        "Une espèce récemment découverte dans des zones isolées de domestication",
        "Un hybride naturel résultant de croisements spontanés entre espèces proches"
    ],
    correct: 0,
    explanation: "Une lignée domestiquée est un groupe d'individus d'une espèce (animale ou végétale) qui a acquis au fil des générations des performances, une apparence et une histoire sélective uniformes selon les sélections effectuées par l'Homme."
},
{
    question: "Quelle est la différence entre zone de domestication et zone de diversification ?",
    options: [
        "Il n'y a pas de différence, les deux termes désignent la même région",
        "Domestication : mise sous dépendance Homme ; Diversification : sélection plusieurs formes/lignées",
        "Les deux termes sont synonymes et utilisés de façon interchangeable",
        "Zone de domestication est toujours plus grande que zone de diversification"
    ],
    correct: 1,
    explanation: "La zone de domestication est l'aire où s'est effectuée la mise 'sous dépendance totale' de l'Homme. La zone de diversification est celle où plusieurs formes ont été sélectionnées à partir du premier type domestiqué pour donner plusieurs lignées domestiquées."
},
{
    question: "Qu'est-ce qu'une zone d'acclimatation ?",
    options: [
        "La zone d'origine géographique naturelle d'une espèce sauvage donnée",
        "Une zone sans climat stable, avec des variations extrêmes de température",
        "Installation organisme région différente de son aire origine, capable d'y survivre",
        "Une zone protégée spécialement créée pour la conservation des espèces"
    ],
    correct: 2,
    explanation: "Une zone d'acclimatation est une région où un organisme a été installé hors de son aire d'origine et où il est capable de survivre et se reproduire."
},
{
    question: "Pourquoi les premiers humains ont-ils commencé à pratiquer l'élevage ?",
    options: [
        "Pour le sport, les loisirs et les compétitions entre tribus",
        "Assurer approvisionnement régulier viande fraîche (garde-manger toujours disponible)",
        "Pour décorer leurs campements et impressionner les autres groupes",
        "Par hasard sans raison précise, juste par curiosité naturelle"
    ],
    correct: 1,
    explanation: "L'élevage permettait d'assurer un approvisionnement régulier en viande fraîche, créant un 'garde-manger disponible', contrairement à la chasse qui dépendait du hasard des rencontres et où le surplus de viande se dégradait avec le temps."
},
{
    question: "Quand et où les bovins ont-ils été domestiqués en Inde ?",
    options: [
        "Il y a 5 000 ans dans les montagnes de l'Himalaya",
        "Il y a 10 000 ans dans la vallée fertile de l'Indus",
        "Il y a 20 000 ans dans les plaines du sud de l'Inde",
        "Il y a 2 000 ans dans les régions montagneuses du Pakistan"
    ],
    correct: 1,
    explanation: "En Inde, les bovins ont été domestiqués il y a 10 000 ans dans la vallée de l'Indus. La domestication s'est produite indépendamment à plusieurs endroits de manière quasi synchrone."
},
{
    question: "Quand la sous-espèce européenne d'aurochs (Bos primigenius primigenius) a-t-elle disparu ?",
    options: [
        "Au Moyen Âge lors des grandes chasses royales médiévales",
        "Au 17ème siècle (1627 en Pologne), dernier spécimen documenté",
        "Au 19ème siècle pendant la révolution industrielle en Europe",
        "Elle existe encore aujourd'hui dans quelques réserves naturelles protégées"
    ],
    correct: 1,
    explanation: "L'aurochs européen (Bos primigenius primigenius), représenté sur les peintures pariétales de Lascaux et Chauvet, a disparu au 17ème siècle, le dernier spécimen étant mort en 1627 en Pologne."
},
{
    question: "Quelle découverte majeure Edward Jenner a-t-il faite vers 1790 grâce à l'élevage bovin ?",
    options: [
        "L'antibiotique permettant de traiter les infections bactériennes graves",
        "La vaccination (personnes avec vaches n'attrapaient pas la variole)",
        "L'insuline pour le traitement du diabète chez les humains",
        "Les vitamines essentielles présentes dans le lait des bovins"
    ],
    correct: 1,
    explanation: "Edward Jenner a découvert la vaccination vers 1790 en observant que les personnes travaillant avec les vaches n'attrapaient jamais la variole car elles étaient porteuses de la vaccine, une maladie similaire mais inoffensive pour les humains."
},
{
    question: "Quelle espèce de chat sauvage est à l'origine du chat domestique actuel ?",
    options: [
        "Le chat sauvage européen (Felis silvestris silvestris)",
        "Felis silvestris lybica (Asie du Sud-Ouest et Afrique du Nord)",
        "Le lynx roux d'Amérique du Nord (Lynx rufus)",
        "Le tigre sauvage d'Asie du Sud-Est (Panthera tigris)"
    ],
    correct: 1,
    explanation: "Le chat domestique actuel descend principalement de Felis silvestris lybica d'Asie du Sud-Ouest et d'Afrique du Nord (Égypte). Prionailurus bengalensis a été utilisé en Chine mais n'a pas contribué aux races actuelles (sauf le chat du Bengale)."
},
{
    question: "Quelle différence comportementale majeure distingue le chat sauvage du chat domestique ?",
    options: [
        "Le chat domestique est carnivore strict, le sauvage est herbivore",
        "Chats sauvages grandement solitaires, domestiques tolèrent humains et autres chats",
        "Le chat domestique ne chasse pas du tout, contrairement au sauvage",
        "Il n'y a aucune différence comportementale entre les deux types"
    ],
    correct: 1,
    explanation: "Les différences comportementales les plus marquées concernent la sociabilité : les chats sauvages sont grandement solitaires tandis que les chats domestiques 'tolèrent' les humains et les autres chats à proximité."
},
{
    question: "Quel est l'état actuel des populations de chevaux sauvages ?",
    options: [
        "Très nombreuses populations sauvages réparties dans le monde entier",
        "Seulement en Amérique du Nord et du Sud, nombreuses populations",
        "Plus aucune population réellement sauvage (sauf cheval de Przewalski)",
        "En augmentation constante grâce aux programmes de réintroduction globaux"
    ],
    correct: 2,
    explanation: "Plus aucune population de cheval réellement 'sauvage' n'existe actuellement. Le cheval de Przewalski (Mongolie) représente l'héritage 'vivant' de la forme sauvage originelle d'il y a 5000 ans, avant l'élevage."
},
{
    question: "Quelles sont les principales différences entre compartiments cultivé et sauvage d'une espèce végétale ?",
    options: [
        "Aucune différence génétique ou phénotypique entre les deux compartiments",
        "Cultivé : grande variabilité génétique ; Sauvage : faible variabilité génétique",
        "Les deux compartiments ont exactement la même variabilité génétique",
        "Cultivé : faible variabilité, sélection artificielle ; Sauvage : grande variabilité, sélection naturelle"
    ],
    correct: 3,
    explanation: "Le compartiment cultivé présente une faible variabilité génétique (sélection artificielle, cultivars élites), tandis que le compartiment sauvage montre une grande variabilité phénotypique (sélection naturelle, adaptations locales, résistance aux maladies)."
},
{
    question: "Pourquoi est-il important de conserver la diversité génétique du compartiment sauvage ?",
    options: [
        "Pour amélioration espèces cultivées et adaptation aux changements environnementaux",
        "Pour des raisons esthétiques uniquement, pour maintenir la beauté naturelle",
        "Ce n'est pas important, seules les variétés cultivées comptent",
        "Uniquement pour les musées et les collections botaniques historiques"
    ],
    correct: 0,
    explanation: "Il est crucial de conserver la diversité génétique (au moins dans le compartiment sauvage) pour l'amélioration des espèces cultivées et pour permettre une adaptation rapide aux changements environnementaux actuels. Pas d'évolution possible sans variabilité."
},
{
    question: "Qu'est-ce que la 'taille efficace de population' (Ne) ?",
    options: [
        "Le nombre total d'individus présents dans une population donnée",
        "La taille physique moyenne des individus d'une population",
        "Le nombre de prédateurs qui régulent la population naturellement",
        "Le nombre de reproducteurs qui ont produit la génération suivante"
    ],
    correct: 3,
    explanation: "La taille efficace de population (Ne) est le nombre de reproducteurs au sein d'une population qui ont produit la génération suivante. L'utilisation intensive de cultivars 'élites' diminue cette taille efficace, créant des populations génétiquement uniformes."
},
{
    question: "Qu'est-ce que le bouturage et quel est son avantage ?",
    options: [
        "Reproduction par partition parties supérieures, permet maturité sexuelle rapide",
        "Une technique de greffe complexe nécessitant des compétences horticoles avancées",
        "Un type de fertilisation artificielle utilisé pour les plantes ornementales",
        "Une méthode d'irrigation goutte-à-goutte pour les cultures maraîchères"
    ],
    correct: 0,
    explanation: "Le bouturage ('cutting') est une technique où des parties supérieures de la plante sont prélevées et développent des racines. Les plantes bouturées atteignent leur maturité sexuelle (floraison) rapidement, ce qui est très utile en horticulture."
},
{
    question: "Qu'est-ce que le marcottage ?",
    options: [
        "Division des racines uniquement pour créer de nouveaux plants",
        "Production de racines à partir d'une tige touchant le sol",
        "Un type de semis particulier utilisé en agriculture biologique",
        "Une maladie fongique qui affecte les tiges des plantes cultivées"
    ],
    correct: 1,
    explanation: "Le marcottage ('layering') est la production de méristèmes racinaires à partir de tissus apicaux lorsqu'une tige tombe et touche le sol. Au contact du sol (humidité, minéraux), les cellules se différencient en racines."
},
{
    question: "Comment la téosinte s'est-elle adaptée au climat tempéré français ?",
    options: [
        "Elle ne s'est pas adaptée et ne peut survivre en climat tempéré",
        "Par sélection naturelle simple sur plusieurs milliers de générations",
        "Par échanges génétiques avec maïs tempéré européen (gènes ZCN8 et ACC1)",
        "Par mutation spontanée uniquement sans aucun apport génétique extérieur"
    ],
    correct: 2,
    explanation: "La téosinte s'est adaptée au climat tempéré français par échanges génétiques avec le maïs tempéré européen, acquérant notamment le gène ZCN8 (précocité de floraison) et la forme mutante du gène ACC1 (résistance aux herbicides)."
},
{
    question: "Quelles sont les 3 catégories principales de techniques de sélection végétale ?",
    options: [
        "Arrosage optimal, fertilisation intensive, taille raisonnée des plants",
        "Semis direct, plantation en ligne, récolte mécanisée des cultures",
        "Agriculture biologique, conventionnelle, intensive à hauts rendements",
        "Cultures sélectives (croisements), mutagenèse, ingénierie génétique ciblée"

{

    options: [
        "6 milliards avec un taux de croissance stable",
        "8,25 milliards avec croissance de 73 millions/an (2,3 individus/seconde)",
        "7 milliards avec ralentissement important de la croissance",
        "10 milliards avec accélération de la croissance démographique"
    ],

        ];

        let currentQuestion = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let userAnswers = [];
        let shuffledQuestions = [];

        // Fonction pour mélanger un tableau (algorithme de Fisher-Yates)
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialiser le quiz avec les questions mélangées
        function initQuiz() {
            shuffledQuestions = shuffleArray(questions);
            currentQuestion = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            userAnswers = [];
            loadQuestion();
        }

        function loadQuestion() {
            const question = shuffledQuestions[currentQuestion];
            const quizContent = document.getElementById('quizContent');
            
            quizContent.innerHTML = `
                <div class="question-block active">
                    <div class="question-number">Question ${currentQuestion + 1} sur ${shuffledQuestions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="options" id="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})">
                                <input type="radio" name="answer" id="option${index}" value="${index}">
                                <label for="option${index}">${option}</label>
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="buttons">
                        <button class="btn-validate" id="validateBtn" onclick="validateAnswer()" disabled>
                            ✓ Valider la réponse
                        </button>
                        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">
                            Question suivante →
                        </button>
                    </div>
                </div>
            `;
            
            updateProgress();
        }

        function selectOption(index) {
            document.querySelectorAll('.option').forEach(opt => {
                opt.style.background = '#f8f9fa';
                opt.style.borderColor = '#e0e0e0';
            });
            
            const selectedOption = document.querySelectorAll('.option')[index];
            selectedOption.style.background = '#f0f4ff';
            selectedOption.style.borderColor = '#667eea';
            
            document.getElementById(`option${index}`).checked = true;
            document.getElementById('validateBtn').disabled = false;
        }

        function validateAnswer() {
            const selectedOption = document.querySelector('input[name="answer"]:checked');
            if (!selectedOption) return;
            
            const userAnswer = parseInt(selectedOption.value);
            const question = shuffledQuestions[currentQuestion];
            const isCorrect = userAnswer === question.correct;
            
            userAnswers.push({
                question: currentQuestion,
                answer: userAnswer,
                correct: isCorrect
            });
            
            if (isCorrect) {
                correctAnswers++;
            } else {
                incorrectAnswers++;
            }
            
            const options = document.querySelectorAll('.option');
            options.forEach((opt, index) => {
                opt.style.pointerEvents = 'none';
                if (index === question.correct) {
                    opt.classList.add('correct');
                } else if (index === userAnswer && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });
            
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'incorrect');
            feedback.innerHTML = `
                <strong>${isCorrect ? '✓ Bonne réponse !' : '✗ Mauvaise réponse'}</strong>
                ${question.explanation}
            `;
            
            document.getElementById('validateBtn').style.display = 'none';
            document.getElementById('nextBtn').classList.add('show');
        }

        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} sur ${shuffledQuestions.length}`;
        }

        function showResults() {
            document.querySelector('.progress-container').style.display = 'none';
            document.getElementById('quizContent').style.display = 'none';
            
            const percentage = Math.round((correctAnswers / shuffledQuestions.length) * 100);
            document.getElementById('scoreCircle').textContent = percentage + '%';
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('incorrectCount').textContent = incorrectAnswers;
            document.getElementById('results').classList.add('show');
        }

        function restartQuiz() {
            document.querySelector('.progress-container').style.display = 'block';
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            
            initQuiz();
        }

        // Démarrer le quiz avec les questions mélangées
        initQuiz();
    </script>
</body>
</html>
