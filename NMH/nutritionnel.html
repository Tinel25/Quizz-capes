    </style>
</head>

    <script>
        const questions = [
            {
    question: "Quel pourcentage des maladies cardiovasculaires est lié à des défauts de nutrition ?",

},
{

{

{

{

},
{
    question: "À quoi servent les nutriments structuraux chez l'adulte ?",

        "Au remplacement des cellules de l'épiderme, tissus osseux, sang et cicatrisation",

},
{

        "L'eau, les vitamines, les minéraux et les oligoéléments",

},
{
    question: "Quelle est la valeur énergétique d'1 gramme de lipides ?",
    options: [
        "1 gramme de lipides fournit 4 Kcal d'énergie",

        "1 gramme de lipides fournit 2 Kcal d'énergie",

},
{
    question: "Sous quelle forme sont principalement stockés les glucides dans l'organisme ?",

        "Sous forme de triglycérides dans le tissu adipeux",

{
    question: "À quoi servent les nutriments fonctionnels ?",

        "Ils participent au fonctionnement de l'organisme et à la communication cellulaire",

},

{

    options: [

},
{
    question: "Quels sont les deux acides gras essentiels ?",

        "Les acides oléique et palmitique uniquement",
        "Les acides stéarique et arachidonique seulement",

    ],
    correct: 2,
    explanation: "Les deux acides gras essentiels sont les acides linoléique et α-linolénique."
},
{
    question: "Qu'est-ce qu'un nutriment semi-essentiel ou conditionnellement indispensable ?",
    options: [
        "Un nutriment jamais synthétisé par l'organisme en aucune circonstance",
        "Un nutriment pouvant être synthétisé mais devant être apporté dans certaines situations",
        "Un nutriment totalement non-essentiel pour l'organisme humain",
        "Un nutriment exclusivement apporté par l'alimentation en permanence"

    explanation: "Un nutriment semi-essentiel peut être synthétisé par l'organisme mais doit être apporté par l'alimentation dans certaines situations pour atteindre un état physiologique satisfaisant."
},
{
    question: "Donnez un exemple de nutriment semi-essentiel.",

        "La leucine qui est toujours essentielle",
        "Le glucose qui est toujours non-essentiel",
        "L'acide linoléique qui est toujours essentiel",
        "Le tryptophane ou la vitamine PP lors de la grossesse"

    explanation: "Des exemples de nutriments semi-essentiels sont le tryptophane, la vitamine PP lors de la grossesse, ou la cystéine chez l'enfant prématuré."
},
{
    question: "Qu'est-ce qu'un nutriment non-essentiel ?",
    options: [
        "Un nutriment toxique pour l'organisme humain",
        "Un nutriment ne servant à aucune fonction physiologique",
        "Un nutriment pouvant être synthétisé par l'organisme",
        "Un nutriment devant obligatoirement être apporté par l'alimentation"

    correct: 2,
    explanation: "Un nutriment non-essentiel est un élément pouvant être synthétisé par l'organisme et n'ayant donc pas besoin d'être apporté obligatoirement par l'alimentation."
},
{
    question: "Que représentent les besoins nutritionnels ?",
    options: [
        "La quantité maximale de nutriments pouvant être consommée sans danger",
        "Uniquement les calories nécessaires pour maintenir le poids corporel",
        "Seulement les vitamines et minéraux requis quotidiennement",
        "La quantité nécessaire pour maintenir les fonctions physiologiques et un état de santé normaux"

},
{
    question: "Quels facteurs font varier les besoins nutritionnels d'un individu à l'autre ?",
    options: [
        "Constitution génétique, vitesse de croissance, activité, environnement, interactions entre nutriments",
        "Uniquement la couleur des yeux et la taille des cheveux",

    explanation: "Les besoins varient selon la constitution génétique, la vitesse de croissance, l'activité, l'environnement, les interactions entre nutriments, etc."
},
{
    question: "Qu'est-ce que le Besoin Nutritionnel Moyen (BNM) ?",
    options: [
        "Le besoin maximal observé dans une population donnée",

        "Le besoin identique pour tous les individus sans exception",
        "Le besoin moyen dans une population de même sexe et d'âge donné"

},
{
    question: "Qu'est-ce que la Référence Nutritionnelle pour une Population (RNP) ?",
    options: [
        "L'apport qui couvre le besoin de seulement 50% de la population",

        "L'apport minimal permettant d'éviter la mort par carence",

    ],

    explanation: "Le RNP est l'apport couvrant le besoin de 97,5% de la population, calculé à partir du BNM (anciennement ANC)."
},
{

        "Le rapport entre le volume d'O2 inspiré et le volume total pulmonaire",
        "Le rapport entre le CO2 produit et l'O2 consommé lors du métabolisme",
        "Le rapport entre la fréquence respiratoire et la fréquence cardiaque",
        "Le rapport entre l'air inspiré et l'air expiré totalement"
    ],
    correct: 1,
    explanation: "Le quotient respiratoire (QR) est le rapport entre le volume de CO2 produit et le volume d'O2 consommé lors du métabolisme des nutriments."
}

        ];

        let currentQuestion = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let userAnswers = [];
        let shuffledQuestions = [];

        // Fonction pour mélanger un tableau (algorithme de Fisher-Yates)
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialiser le quiz avec les questions mélangées
        function initQuiz() {
            shuffledQuestions = shuffleArray(questions);
            currentQuestion = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            userAnswers = [];
            loadQuestion();
        }

        function loadQuestion() {
            const question = shuffledQuestions[currentQuestion];
            const quizContent = document.getElementById('quizContent');
            
            quizContent.innerHTML = `
                <div class="question-block active">
                    <div class="question-number">Question ${currentQuestion + 1} sur ${shuffledQuestions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="options" id="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})">
                                <input type="radio" name="answer" id="option${index}" value="${index}">
                                <label for="option${index}">${option}</label>
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="buttons">
                        <button class="btn-validate" id="validateBtn" onclick="validateAnswer()" disabled>
                            ✓ Valider la réponse
                        </button>
                        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">
                            Question suivante →
                        </button>
                    </div>
                </div>
            `;
            
            updateProgress();
        }

        function selectOption(index) {
            document.querySelectorAll('.option').forEach(opt => {
                opt.style.background = '#f8f9fa';
                opt.style.borderColor = '#e0e0e0';
            });
            
            const selectedOption = document.querySelectorAll('.option')[index];
            selectedOption.style.background = '#f0f4ff';
            selectedOption.style.borderColor = '#667eea';
            
            document.getElementById(`option${index}`).checked = true;
            document.getElementById('validateBtn').disabled = false;
        }

        function validateAnswer() {
            const selectedOption = document.querySelector('input[name="answer"]:checked');
            if (!selectedOption) return;
            
            const userAnswer = parseInt(selectedOption.value);
            const question = shuffledQuestions[currentQuestion];
            const isCorrect = userAnswer === question.correct;
            
            userAnswers.push({
                question: currentQuestion,
                answer: userAnswer,
                correct: isCorrect
            });
            
            if (isCorrect) {
                correctAnswers++;
            } else {
                incorrectAnswers++;
            }
            
            const options = document.querySelectorAll('.option');
            options.forEach((opt, index) => {
                opt.style.pointerEvents = 'none';
                if (index === question.correct) {
                    opt.classList.add('correct');
                } else if (index === userAnswer && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });
            
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'incorrect');
            feedback.innerHTML = `
                <strong>${isCorrect ? '✓ Bonne réponse !' : '✗ Mauvaise réponse'}</strong>
                ${question.explanation}
            `;
            
            document.getElementById('validateBtn').style.display = 'none';
            document.getElementById('nextBtn').classList.add('show');
        }

        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} sur ${shuffledQuestions.length}`;
        }

        function showResults() {
            document.querySelector('.progress-container').style.display = 'none';
            document.getElementById('quizContent').style.display = 'none';
            
            const percentage = Math.round((correctAnswers / shuffledQuestions.length) * 100);
            document.getElementById('scoreCircle').textContent = percentage + '%';
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('incorrectCount').textContent = incorrectAnswers;
            document.getElementById('results').classList.add('show');
        }

        function restartQuiz() {
            document.querySelector('.progress-container').style.display = 'block';
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            
            initQuiz();
        }

        // Démarrer le quiz avec les questions mélangées
        initQuiz();
    </script>
</body>
</html>
